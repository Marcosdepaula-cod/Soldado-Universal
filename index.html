// Valores MET (equivalente metabólico) aproximados por tipo de treino — estimativa, não medição real.
const MET_VALUES = { Musculação: 5, Cardio: 7, Funcional: 6.5, Outro: 5 };
function estimateCaloriesBurned(type, minutes, weightKg) {
  const met = MET_VALUES[type] || 5;
  return Math.round(met * weightKg * (Number(minutes || 0) / 60));
}

function resolveLowestStock(stock, candidates) {
  let best = candidates[0];
  let bestVal = stock[best] ?? 0;
  for (const c of candidates.slice(1)) {
    const v = stock[c] ?? 0;
    if (v < bestVal) { best = c; bestVal = v; }
  }
  return best;
}

function computeDecrements(ingredients, stock) {
  const out = [];
  for (const ing of ingredients) {
    if (ing.id) out.push({ id: ing.id, grams: ing.g });
    else if (ing.fruit) out.push({ id: resolveLowestStock(stock, FRUIT_IDS), grams: ing.fruit });
    else if (ing.fruitChoice) out.push({ id: resolveLowestStock(stock, ing.fruitChoice), grams: ing.g });
  }
  return out;
}

function applyDecrements(pantry, decrements) {
  const stock = { ...pantry.stock };
  const warned = { ...pantry.warned };
  const newlyLow = [];
  for (const d of decrements) {
    const item = PANTRY_ITEMS.find((p) => p.id === d.id);
    if (!item) continue;
    const yieldFactor = item.yieldFactor || 1;
    const rawGrams = d.grams / yieldFactor;
    const prev = stock[d.id] ?? 0;
    const next = Math.max(0, prev - rawGrams);
    stock[d.id] = next;
    if (prev > item.threshold && next <= item.threshold && !warned[d.id]) {
      newlyLow.push(item.name);
      warned[d.id] = true;
    }
  }
  return { stock, warned, newlyLow };
}

function formatStock(item, stockGrams, gramsPerUnitOverride) {
  const gpu = gramsPerUnitOverride || item.gramsPerUnit;
  const amount = stockGrams / gpu;
  const rounded = amount < 10 ? Math.round(amount * 10) / 10 : Math.round(amount);
  if (item.isPackage) {
    return `${rounded} pacote${rounded === 1 ? '' : 's'} (${Math.round(stockGrams)}g)`;
  }
  return `${rounded} ${item.unit}`;
}

// Credita (ou remove, com delta negativo) gramas "cruas" no estoque de um item — usado quando a Lista de
// Compras é marcada/desmarcada, pra manter a despensa em dia sem precisar passar pelo "Registrar compra".
function creditPantryStock(pantry, itemId, deltaGrams) {
  const item = PANTRY_ITEMS.find((p) => p.id === itemId);
  if (!item) return pantry;
  const stock = { ...pantry.stock };
  const warned = { ...pantry.warned };
  const prev = stock[itemId] ?? 0;
  const next = Math.max(0, prev + deltaGrams);
  stock[itemId] = next;
  if (next > item.threshold) warned[itemId] = false;
  return { ...pantry, stock, warned };
}

function RingGauge({ value, goal, size = 190, stroke = 15, label }) {
  const r = (size - stroke) / 2;
  const circumference = 2 * Math.PI * r;
  const pct = goal > 0 ? value / goal : 0;
  const clamped = Math.min(Math.max(pct, 0), 1);
  const dashOffset = circumference * (1 - clamped);
  const over = value > goal;
  const arcColor = over ? PALETTE.paprika : PALETTE.honey;
  const center = size / 2;

  const ticks = [];
  for (let i = 0; i < 10; i++) {
    const angle = (i * 36 - 90) * (Math.PI / 180);
    const outerR = r - stroke / 2 - 3;
    const innerR = outerR - 7;
    ticks.push({
      x1: center + innerR * Math.cos(angle),
      y1: center + innerR * Math.sin(angle),
      x2: center + outerR * Math.cos(angle),
      y2: center + outerR * Math.sin(angle),
    });
  }

  return (
    <div style={{ position: 'relative', width: size, height: size, flexShrink: 0 }}>
      <svg width={size} height={size}>
        {ticks.map((t, i) => (
          <line key={i} x1={t.x1} y1={t.y1} x2={t.x2} y2={t.y2} stroke={PALETTE.border} strokeWidth={2} strokeLinecap="round" />
        ))}
        <g style={{ transform: 'rotate(-90deg)', transformOrigin: `${center}px ${center}px` }}>
          <circle cx={center} cy={center} r={r} fill="none" stroke={PALETTE.track} strokeWidth={stroke} />
          <circle
            cx={center}
            cy={center}
            r={r}
            fill="none"
            stroke={arcColor}
            strokeWidth={stroke}
            strokeDasharray={circumference}
            strokeDashoffset={dashOffset}
            strokeLinecap="round"
            style={{ transition: 'stroke-dashoffset 0.6s ease, stroke 0.3s ease' }}
          />
        </g>
      </svg>
      <div
        style={{
          position: 'absolute',
          inset: 0,
          display: 'flex',
          flexDirection: 'column',
          alignItems: 'center',
          justifyContent: 'center',
        }}
      >
        <div style={{ fontFamily: FONT_MONO, fontSize: size * 0.2, fontWeight: 600, color: PALETTE.text, lineHeight: 1 }}>
          {Math.round(value)}
        </div>
        <div style={{ fontFamily: FONT_MONO, fontSize: 13, color: PALETTE.textMuted, marginTop: 4 }}>/ {goal} kcal</div>
        {label && (
          <div style={{ fontSize: 11, color: PALETTE.textMuted, marginTop: 6, letterSpacing: 1.5, textTransform: 'uppercase' }}>
            {label}
          </div>
        )}
      </div>
    </div>
  );
}

function WeightChart({ weights }) {
  const sorted = [...weights].sort((a, b) => (a.date < b.date ? -1 : 1));
  if (sorted.length < 2) {
    return <p style={{ fontSize: 13, color: PALETTE.textMuted }}>Registre pelo menos 2 pesagens pra ver a tendência.</p>;
  }
  const w = 300, h = 130, pad = 22;
  const kgs = sorted.map((p) => p.kg);
  const min = Math.min(...kgs, 85) - 2;
  const max = Math.max(...kgs) + 2;
  const xStep = (w - pad * 2) / (sorted.length - 1);
  const yFor = (kg) => h - pad - ((kg - min) / (max - min)) * (h - pad * 2);
  const points = sorted.map((pt, i) => `${pad + i * xStep},${yFor(pt.kg)}`).join(' ');
  const goalY = yFor(85);
  const goalY90 = yFor(90);
  return (
    <svg width="100%" viewBox={`0 0 ${w} ${h}`} style={{ overflow: 'visible' }}>
      <line x1={pad} y1={goalY90} x2={w - pad} y2={goalY90} stroke={PALETTE.textMuted} strokeDasharray="3 4" strokeWidth="1" />
      <line x1={pad} y1={goalY} x2={w - pad} y2={goalY} stroke={PALETTE.sage} strokeDasharray="3 4" strokeWidth="1" />
      <polyline points={points} fill="none" stroke={PALETTE.honey} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      {sorted.map((pt, i) => (
        <circle key={i} cx={pad + i * xStep} cy={yFor(pt.kg)} r="3.5" fill={PALETTE.honey} />
      ))}
    </svg>
  );
}

  function removeFreeIngredient(idx) {

  }

  function normalizeText(s) {
    return s
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .trim();
  }

  function parseFreeText(text) {
    const normalized = text.replace(/\s+e\s+/gi, ', ').replace(/\s+com\s+/gi, ', ');
    const segments = normalized
      .split(/[,;]|(?<=\))\s*/)
      .map((s) => s.replace(/^[()]+|[()]+$/g, '').trim())
      .filter(Boolean);
    const matched = [];
    const unmatched = [];
    for (const seg of segments) {
      const m = seg.match(/^(\d+(?:[.,]\d+)?)\s*(gramas?|g|ml|mililitros?|unidades?|un\.?)?\s*(?:de|do|da)?\s*(.+)$/i);
      if (!m) {
        if (seg.length > 1) unmatched.push(seg);
        continue;
      }
      const qty = parseFloat(m[1].replace(',', '.'));
      const unitHint = (m[2] || '').toLowerCase();
      const isUnitHint = unitHint.startsWith('un');
      const namePart = normalizeText(m[3]);
      const food = FOODS.find((f) => {
        const fname = normalizeText(f.name);
        return fname.includes(namePart) || namePart.includes(fname.split(' ')[0]) || namePart.includes(fname.split('(')[0].trim());
      });
      if (!food) {
        unmatched.push(seg);
        continue;
      }
      let kcal, prot;
      if (isUnitHint && food.kcalFixed) {
        kcal = Math.round(food.kcalFixed * qty);
        prot = Math.round((food.protFixed || 0) * qty * 10) / 10;
      } else {
        kcal = Math.round((food.kcal100 / 100) * qty);
        prot = Math.round((food.prot100 / 100) * qty * 10) / 10;
      }
      const grams = isUnitHint ? null : qty;
      matched.push({ id: food.id, name: food.name, qty, isUnitHint, kcal, prot, grams });
    }
    return { matched, unmatched };
  }

  function detectFromDescription() {
    if (!freeDescription.trim()) return;
    const { matched, unmatched } = parseFreeText(freeDescription);
    if (matched.length === 0) {
      setToast('Não reconheci nenhum item — digite kcal/proteína direto, ou use a busca de ingredientes abaixo.');
      return;
    }
    const kcalSum = matched.reduce((s, m) => s + m.kcal, 0);
    const protSum = matched.reduce((s, m) => s + m.prot, 0);
    setFreeKcal(String(Math.round(kcalSum)));
    setFreeProt(String(Math.round(protSum * 10) / 10));
    const newIngredients = matched
      .filter((m) => PANTRY_ITEMS.some((p) => p.id === m.id) && m.grams)
      .map((m) => ({ id: m.id, name: m.name, grams: m.grams, display: `${m.qty}g` }));
    if (newIngredients.length > 0) {
      setFreeIngredients((prev) => [...prev, ...newIngredients]);
    }
    const total = matched.length + unmatched.length;
    setToast(
      unmatched.length > 0
        ? `Reconheci ${matched.length} de ${total}: ${matched.map((m) => m.name.split(' ')[0]).join(', ')}. Não achei: ${unmatched.join(', ')}`

  }

  function undoPurchase(purchase) {
    const nextStock = { ...pantry.stock, [purchase.itemId]: Math.max(0, (pantry.stock[purchase.itemId] || 0) - purchase.grams) };
    const nextPurchases = pantry.recentPurchases.filter((p) => p.ts !== purchase.ts);
    const nextUnitSizes = { ...pantry.unitSizes };
    const nextWarned = { ...pantry.warned };
    const nextConsumptionSeen = { ...pantry.consumptionSeen, [purchase.itemId]: false };
    const stillHasPurchase = nextPurchases.some((p) => p.itemId === purchase.itemId);
    if (!stillHasPurchase && nextStock[purchase.itemId] <= 0) {
      delete nextUnitSizes[purchase.itemId];
      delete nextWarned[purchase.itemId];
    }
    const next = { ...pantry, stock: nextStock, warned: nextWarned, recentPurchases: nextPurchases, unitSizes: nextUnitSizes, consumptionSeen: nextConsumptionSeen };
    setPantry(next);
    saveJSON('pantry', next);
    setToast(`Compra de ${purchase.name} desfeita`);

  function setStockDirectly(itemId, newDisplayAmount, newWeight) {
    const item = PANTRY_ITEMS.find((p) => p.id === itemId);
    if (!item) return;
    const gpu = Number(newWeight) > 0 ? Number(newWeight) : pantry.unitSizes[itemId] || item.gramsPerUnit;
    const grams = Math.max(0, Number(newDisplayAmount)) * gpu;
    const nextStock = { ...pantry.stock, [itemId]: grams };
    const nextWarned = { ...pantry.warned };
    const nextUnitSizes = { ...pantry.unitSizes, [itemId]: gpu };
    const nextConsumptionSeen = { ...pantry.consumptionSeen, [itemId]: false };
    if (grams > item.threshold) nextWarned[itemId] = false;
    const next = { ...pantry, stock: nextStock, warned: nextWarned, unitSizes: nextUnitSizes, consumptionSeen: nextConsumptionSeen };
    setPantry(next);
    saveJSON('pantry', next);
    setToast(`${item.name} corrigido`);

  function addPantryPurchase() {

    const grams = Number(pantryAmount) * unitSize;
    const nextStock = { ...pantry.stock, [selectedPantryItem.id]: (pantry.stock[selectedPantryItem.id] || 0) + grams };
    const nextWarned = { ...pantry.warned };
    if (nextStock[selectedPantryItem.id] > selectedPantryItem.threshold) nextWarned[selectedPantryItem.id] = false;
    const nextUnitSizes = { ...pantry.unitSizes, [selectedPantryItem.id]: unitSize };
    const nextPurchases = [
      { ts: Date.now(), itemId: selectedPantryItem.id, name: selectedPantryItem.name, amount: pantryAmount, unit: selectedPantryItem.unit, grams },

  }

  // Marca/desmarca um item da Lista de Compras. Ao marcar, credita os ingredientes correspondentes
  // direto na despensa (sem passar pelo "Registrar compra"); ao desmarcar, desfaz o crédito.
  function toggleShoppingItem(entry) {
    const wasChecked = !!shopping.checked[entry.key];
    const sign = wasChecked ? -1 : 1;
    let nextPantry = pantry;
    for (const t of entry.targets) {
      nextPantry = creditPantryStock(nextPantry, t.id, sign * t.grams);
    }
    setPantry(nextPantry);
    saveJSON('pantry', nextPantry);
    const nextShopping = { ...shopping, checked: { ...shopping.checked, [entry.key]: !wasChecked } };
    setShopping(nextShopping);
    saveJSON('shopping', nextShopping);
    setToast(wasChecked ? `${entry.name} desmarcado` : `${entry.name} adicionado à despensa`);
  }

  function updateShoppingPrice(key, value) {
    const nextShopping = { ...shopping, prices: { ...shopping.prices, [key]: value } };
    setShopping(nextShopping);
    saveJSON('shopping', nextShopping);
  }

  function resetShoppingList() {
    const next = emptyShopping();
    setShopping(next);
    saveJSON('shopping', next);
    setToast('Lista de compras reiniciada');
  }

  const totalKcal = today.meals.reduce((s, m) => s + m.kcal, 0);
  const totalProt = today.meals.reduce((s, m) => s + m.prot, 0);
  const totalWaterMl = (today.waterLog || []).reduce((s, w) => s + w.ml, 0);
  const treatLoggedToday = today.meals.some((m) => m.mealType === 'ceia');
  const over = totalKcal - settings.kcalGoal;

  const latestWeightKg = useMemo(() => {
    if (!weights.length) return 80;
    const sorted = [...weights].sort((a, b) => (a.date < b.date ? -1 : 1));
    return sorted[sorted.length - 1].kg;
  }, [weights]);

  const week = getLastNDates(7).map((d) => {
    const day = logs[d] || emptyDay();
    const ex = day.exercise || {};
    return {
      date: d,
      kcal: day.meals.reduce((s, m) => s + m.kcal, 0),
      prot: day.meals.reduce((s, m) => s + m.prot, 0),
      kcalBurned: ex.done ? estimateCaloriesBurned(ex.type, ex.duration, latestWeightKg) : 0,
    };
  });
  const weekTotalKcal = week.reduce((s, d) => s + d.kcal, 0);
  const weekTotalProt = week.reduce((s, d) => s + d.prot, 0);
  const weekTotalBurned = week.reduce((s, d) => s + d.kcalBurned, 0);
  const weekGoalKcal = settings.kcalGoal * 7;
  const weekGoalProt = settings.proteinGoal * 7;
  const weekOverKcal = weekTotalKcal - weekGoalKcal;
  const weekOverProt = weekTotalProt - weekGoalProt;

  const presetKey = PRESET_MAP[mealType];
  const presets = presetKey ? DIET[presetKey] : [];

  const shoppingPrice = (it) => {
    const v = shopping.prices[it.key];
    return v !== undefined && v !== '' && !Number.isNaN(Number(v)) ? Number(v) : it.priceEst;
  };
  const shoppingTotalEst = SHOPPING_LIST.reduce((s, it) => s + it.priceEst, 0);
  const shoppingTotalNow = SHOPPING_LIST.reduce((s, it) => s + shoppingPrice(it), 0);
  const shoppingCheckedCount = SHOPPING_LIST.filter((it) => shopping.checked[it.key]).length;
  const shoppingSpent = SHOPPING_LIST.reduce((s, it) => (shopping.checked[it.key] ? s + shoppingPrice(it) : s), 0);

  const filteredFoods = useMemo(() => {
    if (!search.trim()) return [];
    const q = search.trim().toLowerCase();
    return FOODS.filter((f) => f.name.toLowerCase().includes(q)).slice(0, 8);
  }, [search]);

  const isUnitBased = selectedFood && UNIT_CONSUMABLE_IDS.has(selectedFood.id) && foodEntryMode === 'unit';
  const effectiveGrams = isUnitBased ? (Number(unitQty) || 0) * (Number(unitWeight) || 0) : Number(amount) || 0;
  const previewKcal =
    selectedFood && effectiveGrams
      ? selectedFood.kcalFixed
        ? Math.round(selectedFood.kcalFixed * effectiveGrams)
        : Math.round((selectedFood.kcal100 / 100) * effectiveGrams)
      : 0;
  const previewProt =
    selectedFood && effectiveGrams
      ? selectedFood.protFixed
        ? Math.round(selectedFood.protFixed * effectiveGrams * 10) / 10
        : Math.round((selectedFood.prot100 / 100) * effectiveGrams * 10) / 10
      : 0;

  const filteredFreeIng = useMemo(() => {
    if (!freeIngSearch.trim()) return [];
    const q = freeIngSearch.trim().toLowerCase();
    return PANTRY_ITEMS.filter((f) => f.name.toLowerCase().includes(q)).slice(0, 8);
  }, [freeIngSearch]);
  const freeIngIsUnitBased = freeIngSelected && UNIT_CONSUMABLE_IDS.has(freeIngSelected.id) && freeIngEntryMode === 'unit';
  const freeIngEffectiveGrams = freeIngIsUnitBased ? (Number(freeIngQty) || 0) * (Number(freeIngWeight) || 0) : Number(freeIngQty) || 0;

  const filteredPantryItems = useMemo(() => {
    if (!pantrySearch.trim()) return [];
    const q = pantrySearch.trim().toLowerCase();
    return PANTRY_ITEMS.filter((f) => f.name.toLowerCase().includes(q)).slice(0, 8);
  }, [pantrySearch]);

  const emptyStockItems = useMemo(

                              fontSize: 11,
                              fontWeight: 600,

                      </div>

                  <div style={{ fontSize: 13, color: PALETTE.textMuted }}>Nenhuma refeição registrada ainda. Toque em "Refeições" abaixo pra começar.</div>

                    {today.meals.map((m) => (
                      <div key={m.ts} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8 }}>
                        <div style={{ fontSize: 13, flex: 1 }}>{m.name}</div>

                          <X size={14} />
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <StockAlertBanner items={emptyStockItems} level="empty" onClick={() => setTab('despensa')} />
              <StockAlertBanner items={lowStockItems} level="low" onClick={() => setTab('despensa')} />
            </div>

                  <PillButton key={mt.id} active={mealType === mt.id} onClick={() => { setMealType(mt.id); setSelectedFood(null); setSearch(''); }}>
                    {mt.label}

                  <div style={{ fontSize: 11.5, color: weekendNote ? PALETTE.honey : PALETTE.textMuted, fontFamily: FONT_MONO }}>

                  <div style={{ fontSize: 12.5, color: PALETTE.text, lineHeight: 1.4 }}>

                  </div>
                </div>
              )}

              {presets.length > 0 && (
                <div>
                  <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 0.8, textTransform: 'uppercase', color: PALETTE.textMuted, marginBottom: 8 }}>Da dieta</div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                    {presets.map((p) => {
                      const expanded = expandedPreset === p.id;
                      return (
                        <div key={p.id} style={cardStyle({ border: `1px solid ${PALETTE.border}`, padding: 0 })}>
                          <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                            <div
                              role="button"
                              tabIndex={0}
                              onClick={() => addMealEntry({ mealType, presetId: p.id, name: p.name, kcal: p.kcal, prot: p.prot })}
                              onKeyDown={(e) => { if (e.key === 'Enter') addMealEntry({ mealType, presetId: p.id, name: p.name, kcal: p.kcal, prot: p.prot }); }}

                    value={search}
                    onChange={(e) => { setSearch(e.target.value); setSelectedFood(null); }}
                    placeholder="ex: arroz, frango, refrigerante..."
                    style={{ width: '100%', background: PALETTE.surfaceAlt, border: `1px solid ${PALETTE.border}`, borderRadius: 12, color: PALETTE.text, padding: '10px 12px 10px 34px', fontSize: 13.5 }}
                  />

                  <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>

                        key={f.id}

                            const pantryItem = PANTRY_ITEMS.find((p) => p.id === f.id);

                            setUnitWeight(String(pantry.unitSizes[f.id] || (pantryItem ? pantryItem.gramsPerUnit : f.portion)));
                          }
                        }}
                        style={{ ...cardStyle({ textAlign: 'left' }), border: `1px solid ${PALETTE.border}`, cursor: 'pointer', padding: '10px 14px' }}
                      >
                        <div style={{ fontSize: 13.5 }}>{f.name}</div>
                        <div style={{ fontSize: 11.5, color: PALETTE.textMuted, marginTop: 2 }}>
                          {f.kcalFixed ? `${f.kcalFixed} kcal / un` : `${f.kcal100} kcal / 100${f.unit}`}

                      </button>
                    ))}
                  </div>

                  <div style={cardStyle()}>

                        <X size={16} />

                    </div>
                    {UNIT_CONSUMABLE_IDS.has(selectedFood.id) && (
                      <button
                        onClick={() => setFoodEntryMode(foodEntryMode === 'unit' ? 'grams' : 'unit')}
                        style={{ background: 'none', border: 'none', color: PALETTE.textMuted, fontSize: 11, cursor: 'pointer', textDecoration: 'underline', padding: 0, marginBottom: 10, display: 'block' }}
                      >
                        {foodEntryMode === 'unit' ? 'era um pote/pacote grande? registrar em gramas direto' : 'voltar a registrar por unidade'}
                      </button>
                    )}
                    {isUnitBased ? (
                      <div style={{ display: 'flex', gap: 8, marginBottom: 10 }}>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontSize: 11, color: PALETTE.textMuted, marginBottom: 3 }}>quantidade (un)</div>
                          <input
                            type="number"
                            value={unitQty}
                            onChange={(e) => setUnitQty(e.target.value)}
                            style={{ width: '100%', background: PALETTE.surfaceAlt, border: `1px solid ${PALETTE.border}`, borderRadius: 10, color: PALETTE.text, padding: '9px 10px', fontSize: 14 }}

                        <div style={{ flex: 1 }}>
                          <div style={{ fontSize: 11, color: PALETTE.textMuted, marginBottom: 3 }}>peso por un (g)</div>
                          <input
                            type="number"
                            value={unitWeight}
                            onChange={(e) => setUnitWeight(e.target.value)}
                            style={{ width: '100%', background: PALETTE.surfaceAlt, border: `1px solid ${PALETTE.border}`, borderRadius: 10, color: PALETTE.text, padding: '9px 10px', fontSize: 14 }}

                        </div>
                      </div>
                    ) : (
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
                        <input
                          type="number"

                          onChange={(e) => setAmount(e.target.value)}
                          style={{ width: 90, background: PALETTE.surfaceAlt, border: `1px solid ${PALETTE.border}`, borderRadius: 10, color: PALETTE.text, padding: '9px 10px', fontSize: 14 }}
                        />
                        <span style={{ fontSize: 13, color: PALETTE.textMuted }}>{selectedFood.unit}</span>
                      </div>

                    <div style={{ fontFamily: FONT_MONO, fontSize: 13, color: PALETTE.honey, marginBottom: 10, textAlign: 'right' }}>

                    <PrimaryButton
                      onClick={() => {

                          const nextUnitSizes = { ...pantry.unitSizes, [selectedFood.id]: Number(unitWeight) };

                          setPantry(nextPantry);
                          saveJSON('pantry', nextPantry);
                        }
                        addMealEntry({
                          mealType,
                          foodId: selectedFood.id,
                          grams: effectiveGrams,
                          name: isUnitBased ? `${selectedFood.name} (${unitQty}un)` : `${selectedFood.name} (${amount}${selectedFood.unit})`,
                          kcal: previewKcal,

                  tabIndex={0}
                  onClick={() => setPrepExpanded(!prepExpanded)}
                  onKeyDown={(e) => { if (e.key === 'Enter') setPrepExpanded(!prepExpanded); }}
                  style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', cursor: 'pointer' }}
                >
                  <div>
                    <div style={{ fontSize: 13.5, fontWeight: 800 }}>Modo de preparo (quinzenal)</div>
                    <div style={{ fontSize: 11.5, color: PALETTE.textMuted, marginTop: 2 }}>Como cozinhar e guardar as 30 refeições de uma vez</div>
                  </div>
                  <ChevronDown size={16} style={{ transform: prepExpanded ? 'rotate(180deg)' : 'none', transition: 'transform 0.2s ease', flexShrink: 0 }} />
                </div>
                {prepExpanded && (
                  <div style={{ marginTop: 14, display: 'flex', flexDirection: 'column', gap: 12 }}>
                    {PREP_MANUAL.map((phase) => (
                      <div key={phase.title}>
                        <div style={{ fontSize: 12.5, fontWeight: 700, color: PALETTE.honey, marginBottom: 3 }}>{phase.title}</div>
                        <div style={{ fontSize: 12.5, color: PALETTE.text, lineHeight: 1.5 }}>{phase.text}</div>
                      </div>
                    ))}
                    <div style={{ borderTop: `1px solid ${PALETTE.border}`, paddingTop: 10 }}>
                      <div style={{ fontSize: 12.5, fontWeight: 700, color: PALETTE.honey, marginBottom: 6 }}>Armazenamento e transporte</div>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                        {STORAGE_LOGISTICS.map((line, i) => (
                          <div key={i} style={{ fontSize: 12.5, color: PALETTE.text, lineHeight: 1.5 }}>{line}</div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>

              <div style={cardStyle()}>
                <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 0.8, textTransform: 'uppercase', color: PALETTE.textMuted, marginBottom: 10 }}>
                  Lista de Compras · 15 dias / 30 refeições
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12.5, marginBottom: 4 }}>
                  <span style={{ color: PALETTE.textMuted }}>Marcados</span>
                  <span style={{ fontFamily: FONT_MONO }}>{shoppingCheckedCount}/{SHOPPING_LIST.length}</span>
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12.5, marginBottom: 4 }}>
                  <span style={{ color: PALETTE.textMuted }}>Já gasto (marcados)</span>
                  <span style={{ fontFamily: FONT_MONO, color: PALETTE.honey }}>{formatBRL(shoppingSpent)}</span>
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, fontWeight: 800, marginTop: 6, paddingTop: 8, borderTop: `1px solid ${PALETTE.border}` }}>
                  <span>Total da lista</span>
                  <span style={{ fontFamily: FONT_MONO }}>{formatBRL(shoppingTotalNow)}</span>
                </div>
                {Math.abs(shoppingTotalNow - shoppingTotalEst) > 0.01 && (
                  <div style={{ fontSize: 11, color: PALETTE.textMuted, textAlign: 'right', marginTop: 2 }}>
                    estimado do plano: {formatBRL(shoppingTotalEst)}
                  </div>
                )}
              </div>

              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {SHOPPING_LIST.map((it) => {
                  const checked = !!shopping.checked[it.key];
                  return (
                    <div key={it.key} style={cardStyle({ padding: '12px 14px', opacity: checked ? 0.6 : 1 })}>
                      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
                        <div
                          role="button"
                          tabIndex={0}
                          onClick={() => toggleShoppingItem(it)}
                          onKeyDown={(e) => { if (e.key === 'Enter') toggleShoppingItem(it); }}
                          aria-label={checked ? 'Desmarcar item' : 'Marcar como comprado'}
                          style={{ display: 'flex', alignItems: 'flex-start', gap: 10, flex: 1, cursor: 'pointer' }}
                        >
                          <div
                            style={{
                              width: 22,
                              height: 22,
                              borderRadius: 6,
                              border: `1.5px solid ${checked ? PALETTE.sage : PALETTE.border}`,
                              background: checked ? PALETTE.sage : 'transparent',
                              color: '#1B1815',
                              flexShrink: 0,
                              marginTop: 1,
                              display: 'flex',
                              alignItems: 'center',
                              justifyContent: 'center',
                            }}
                          >
                            {checked && <Check size={14} />}
                          </div>
                          <div style={{ flex: 1 }}>
                            <div style={{ fontSize: 13.5, textDecoration: checked ? 'line-through' : 'none' }}>{it.name}</div>
                            <div style={{ fontSize: 11.5, color: PALETTE.textMuted, marginTop: 1 }}>{it.qtyLabel}</div>
                          </div>
                        </div>
                        <div onClick={(e) => e.stopPropagation()} style={{ display: 'flex', alignItems: 'center', gap: 3, flexShrink: 0 }}>
                          <span style={{ fontSize: 12.5, color: PALETTE.textMuted }}>R$</span>
                          <input
                            type="number"
                            step="0.01"
                            value={shopping.prices[it.key] !== undefined ? shopping.prices[it.key] : it.priceEst}
                            onChange={(e) => updateShoppingPrice(it.key, e.target.value)}
                            style={{
                              width: 76,
                              background: PALETTE.surfaceAlt,
                              border: `1px solid ${PALETTE.border}`,
                              borderRadius: 8,
                              color: PALETTE.text,
                              padding: '6px 6px',
                              fontSize: 13,
                              fontFamily: FONT_MONO,
                              textAlign: 'right',
                            }}
                          />
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              <button
                onClick={resetShoppingList}
                style={{
                  background: 'none',
                  border: `1px solid ${PALETTE.border}`,
                  borderRadius: 14,
                  color: PALETTE.textMuted,
                  fontSize: 12.5,
                  padding: '10px 14px',
                  cursor: 'pointer',
                  textAlign: 'center',
                }}
              >
                Reiniciar lista (começar quinzena nova)
              </button>
            </div>
          )}

          {tab === 'progresso' && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
              <div style={cardStyle()}>
                <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 0.8, textTransform: 'uppercase', color: PALETTE.textMuted, marginBottom: 12 }}>Resumo da semana</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                  <div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 4 }}>
                      <span style={{ fontSize: 12, color: PALETTE.textMuted }}>Calorias</span>
                      <span style={{ fontFamily: FONT_MONO, fontSize: 13 }}>
                        {Math.round(weekTotalKcal)} / {weekGoalKcal} kcal
                      </span>
                    </div>
                    <div style={{ fontSize: 12, color: weekOverKcal > 0 ? PALETTE.paprika : PALETTE.sage }}>
                      {weekOverKcal > 0 ? `${Math.round(weekOverKcal)} kcal acima da meta da semana` : `${Math.round(-weekOverKcal)} kcal abaixo da meta da semana`}
                    </div>
                  </div>
                  <div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 4 }}>
                      <span style={{ fontSize: 12, color: PALETTE.textMuted }}>Proteína</span>
                      <span style={{ fontFamily: FONT_MONO, fontSize: 13 }}>
                        {Math.round(weekTotalProt)} / {weekGoalProt}g
                      </span>
                    </div>
                    <div style={{ fontSize: 12, color: weekOverProt >= 0 ? PALETTE.sage : PALETTE.paprika }}>
                      {weekOverProt >= 0 ? `${Math.round(weekOverProt)}g acima da meta da semana` : `${Math.round(-weekOverProt)}g abaixo da meta da semana`}
                    </div>
                  </div>
                  {weekTotalBurned > 0 && (
                    <div style={{ paddingTop: 8, borderTop: `1px solid ${PALETTE.border}` }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                        <span style={{ fontSize: 12, color: PALETTE.textMuted }}>Estimativa gasta em treino</span>
                        <span style={{ fontFamily: FONT_MONO, fontSize: 13, color: PALETTE.honey }}>~{Math.round(weekTotalBurned)} kcal</span>
                      </div>
                    </div>
                  )}
                </div>
              </div>

              <div style={cardStyle()}>
                <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 0.8, textTransform: 'uppercase', color: PALETTE.textMuted, marginBottom: 10 }}>Últimos 7 dias (kcal)</div>
                <WeekBars data={week} goal={settings.kcalGoal} />
              </div>

              <div style={cardStyle()}>
                <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 0.8, textTransform: 'uppercase', color: PALETTE.textMuted, marginBottom: 10 }}>Peso</div>
                <WeightChart weights={weights} />
                <div style={{ display: 'flex', gap: 8, marginTop: 14 }}>
                  <input
                    type="number"
                    placeholder="peso de hoje (kg)"
                    value={weightInput}
                    onChange={(e) => setWeightInput(e.target.value)}
                    style={{ flex: 1, background: PALETTE.surfaceAlt, border: `1px solid ${PALETTE.border}`, borderRadius: 10, color: PALETTE.text, padding: '9px 10px', fontSize: 13 }}
                  />
                  <button onClick={saveWeight} style={{ padding: '9px 16px', borderRadius: 10, border: 'none', background: PALETTE.honey, color: '#1B1815', fontWeight: 800, fontSize: 13, cursor: 'pointer' }}>
                    Salvar
                  </button>
                </div>
              </div>

              <div style={cardStyle()}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 0.8, textTransform: 'uppercase', color: PALETTE.textMuted }}>Metas diárias</div>
                  {!settingsForm && (
                    <button
                      onClick={() => setSettingsForm({ kcalGoal: settings.kcalGoal, proteinGoal: settings.proteinGoal, waterGoalMl: settings.waterGoalMl })}
                      style={{ background: 'none', border: 'none', color: PALETTE.honey, fontSize: 12, fontWeight: 700, cursor: 'pointer' }}
                    >
                      editar
                    </button>
                  )}
                </div>
                {!settingsForm ? (
                  <div style={{ fontSize: 13, lineHeight: 1.8, color: PALETTE.textMuted }}>
                    <div>Calorias: <strong style={{ color: PALETTE.text }}>{settings.kcalGoal} kcal</strong></div>
                    <div>Proteína: <strong style={{ color: PALETTE.text }}>{settings.proteinGoal}g</strong></div>
                    <div>Água: <strong style={{ color: PALETTE.text }}>{settings.waterGoalMl / 1000}L</strong></div>
                  </div>
                ) : (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                    <label style={{ fontSize: 12, color: PALETTE.textMuted }}>
                      Calorias (kcal)
                      <input
                        type="number"
                        value={settingsForm.kcalGoal}
                        onChange={(e) => setSettingsForm({ ...settingsForm, kcalGoal: e.target.value })}
                        style={{ width: '100%', marginTop: 4, background: PALETTE.surfaceAlt, border: `1px solid ${PALETTE.border}`, borderRadius: 10, color: PALETTE.text, padding: '8px 10px', fontSize: 13 }}
                      />
                    </label>
                    <label style={{ fontSize: 12, color: PALETTE.textMuted }}>
                      Proteína (g)
                      <input
                        type="number"
                        value={settingsForm.proteinGoal}
                        onChange={(e) => setSettingsForm({ ...settingsForm, proteinGoal: e.target.value })}
                        style={{ width: '100%', marginTop: 4, background: PALETTE.surfaceAlt, border: `1px solid ${PALETTE.border}`, borderRadius: 10, color: PALETTE.text, padding: '8px 10px', fontSize: 13 }}
                      />
                    </label>
                    <label style={{ fontSize: 12, color: PALETTE.textMuted }}>
                      Água (ml)
                      <input
                        type="number"
                        value={settingsForm.waterGoalMl}
                        onChange={(e) => setSettingsForm({ ...settingsForm, waterGoalMl: e.target.value })}
                        style={{ width: '100%', marginTop: 4, background: PALETTE.surfaceAlt, border: `1px solid ${PALETTE.border}`, borderRadius: 10, color: PALETTE.text, padding: '8px 10px', fontSize: 13 }}
                      />
                    </label>
                    <div style={{ display: 'flex', gap: 8, marginTop: 4 }}>
                      <button onClick={() => setSettingsForm(null)} style={{ flex: 1, padding: '9px 0', borderRadius: 10, border: `1px solid ${PALETTE.border}`, background: 'transparent', color: PALETTE.textMuted, fontSize: 13, cursor: 'pointer' }}>
                        Cancelar
                      </button>
                      <button onClick={saveSettingsForm} style={{ flex: 1, padding: '9px 0', borderRadius: 10, border: 'none', background: PALETTE.honey, color: '#1B1815', fontWeight: 800, fontSize: 13, cursor: 'pointer' }}>
                        Salvar
                      </button>
                    </div>
                  </div>
                )}
              </div>

              <button
                onClick={resetAllData}
                style={{
                  background: 'none',
                  border: `1px solid ${PALETTE.border}`,
                  borderRadius: 14,
                  color: PALETTE.textMuted,
                  fontSize: 12.5,
                  padding: '10px 14px',
                  cursor: 'pointer',
                  textAlign: 'center',
                }}
              >
                Zerar todos os dados e recomeçar
              </button>
            </div>
          )}
        </div>

        {/* Bottom nav */}
        <div
          style={{
            position: 'sticky',
            bottom: 0,
            background: PALETTE.surface,
            borderTop: `1px solid ${PALETTE.border}`,
            display: 'flex',
            padding: '8px 8px calc(8px + env(safe-area-inset-bottom, 0px))',
            gap: 2,
          }}
        >
          {[
            { id: 'hoje', label: 'Hoje', Icon: Home },
            { id: 'refeicoes', label: 'Refeições', Icon: UtensilsCrossed },
            { id: 'lista', label: 'Lista', Icon: ListChecks },
            { id: 'despensa', label: 'Despensa', Icon: Package },
            { id: 'progresso', label: 'Progresso', Icon: TrendingUp },
          ].map(({ id, label, Icon }) => (
            <button
              key={id}
              onClick={() => setTab(id)}
              style={{
                flex: 1,
                display: 'flex',
                flexDirection: 'column',
                alignItems: 'center',
                gap: 3,
                padding: '8px 0 6px',
                borderRadius: 12,
                border: 'none',
                background: tab === id ? PALETTE.surfaceAlt : 'transparent',
                color: tab === id ? PALETTE.honey : PALETTE.textMuted,
                cursor: 'pointer',
                position: 'relative',
              }}
            >
              <Icon size={18} />
              <span style={{ fontSize: 10, fontWeight: 700 }}>{label}</span>
              {id === 'despensa' && (emptyStockItems.length > 0 || lowStockItems.length > 0) && (
                <span
                  style={{
                    position: 'absolute',
                    top: 4,
                    right: '28%',
                    width: 8,
                    height: 8,
                    borderRadius: '50%',
                    background: PALETTE.paprika,
                  }}
                />
              )}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(<App />);
</script>

<script>
  var src = document.getElementById('app-source').textContent;
  var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
  (0, eval)(out);
</script>
</body>
</html>

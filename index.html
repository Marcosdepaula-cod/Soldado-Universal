function resolveLowestStock(stock, candidates) {
  let best = candidates[0];
  let bestVal = stock[best] ?? 0;
  for (const c of candidates.slice(1)) {
    const v = stock[c] ?? 0;
    if (v < bestVal) { best = c; bestVal = v; }
  }
  return best;
}

function computeDecrements(ingredients, stock) {
  const out = [];
  for (const ing of ingredients) {
    if (ing.id) out.push({ id: ing.id, grams: ing.g });
    else if (ing.fruit) out.push({ id: resolveLowestStock(stock, FRUIT_IDS), grams: ing.fruit });
    else if (ing.fruitChoice) out.push({ id: resolveLowestStock(stock, ing.fruitChoice), grams: ing.g });
  }
  return out;
}

function applyDecrements(pantry, decrements) {
  const stock = { ...pantry.stock };
  const warned = { ...pantry.warned };
  const newlyLow = [];
  for (const d of decrements) {
    const item = PANTRY_ITEMS.find((p) => p.id === d.id);
    if (!item) continue;
    const yieldFactor = item.yieldFactor || 1;
    const rawGrams = d.grams / yieldFactor;
    const prev = stock[d.id] ?? 0;
    const next = Math.max(0, prev - rawGrams);
    stock[d.id] = next;
    if (prev > item.threshold && next <= item.threshold && !warned[d.id]) {
      newlyLow.push(item.name);
      warned[d.id] = true;
    }
  }
  return { stock, warned, newlyLow };
}

function formatStock(item, stockGrams, gramsPerUnitOverride) {
  const gpu = gramsPerUnitOverride || item.gramsPerUnit;
  const amount = stockGrams / gpu;
  const rounded = amount < 10 ? Math.round(amount * 10) / 10 : Math.round(amount);
  if (item.isPackage) {
    return `${rounded} pacote${rounded === 1 ? '' : 's'} (${Math.round(stockGrams)}g)`;
  }
  return `${rounded} ${item.unit}`;
}

function emptyPantry() {
  return { stock: {}, warned: {}, recentPurchases: [], unitSizes: {} };
}

/* ============================== HELPERS ============================== */
function formatDateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function getLastNDates(n) {
  const arr = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    arr.push(formatDateKey(d));
  }
  return arr;
}
function weekdayLabel(dateKey) {
  const d = new Date(dateKey + 'T00:00:00');
  return WEEKDAYS[d.getDay()];
}
const STORAGE_PREFIX = 'noponto:';
function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(STORAGE_PREFIX + key);
    if (!raw) return fallback;
    return JSON.parse(raw);
  } catch (e) {
    return fallback;
  }
}
function saveJSON(key, value) {
  try {
    localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
  } catch (e) {
    console.error('Erro ao salvar', key, e);
  }
}
function emptyDay() {
  return { meals: [], waterLog: [], exercise: { done: false, type: '', duration: '' } };
}

function cardStyle(extra) {

function RingGauge({ value, goal, size = 190, stroke = 15, label }) {
  const r = (size - stroke) / 2;
  const circumference = 2 * Math.PI * r;
  const pct = goal > 0 ? value / goal : 0;
  const clamped = Math.min(Math.max(pct, 0), 1);
  const dashOffset = circumference * (1 - clamped);
  const over = value > goal;
  const arcColor = over ? PALETTE.paprika : PALETTE.honey;
  const center = size / 2;

  const ticks = [];
  for (let i = 0; i < 10; i++) {
    const angle = (i * 36 - 90) * (Math.PI / 180);
    const outerR = r - stroke / 2 - 3;
    const innerR = outerR - 7;
    ticks.push({
      x1: center + innerR * Math.cos(angle),
      y1: center + innerR * Math.sin(angle),
      x2: center + outerR * Math.cos(angle),
      y2: center + outerR * Math.sin(angle),
    });
  }

  return (
    <div style={{ position: 'relative', width: size, height: size, flexShrink: 0 }}>
      <svg width={size} height={size}>
        {ticks.map((t, i) => (
          <line key={i} x1={t.x1} y1={t.y1} x2={t.x2} y2={t.y2} stroke={PALETTE.border} strokeWidth={2} strokeLinecap="round" />
        ))}
        <g style={{ transform: 'rotate(-90deg)', transformOrigin: `${center}px ${center}px` }}>
          <circle cx={center} cy={center} r={r} fill="none" stroke={PALETTE.track} strokeWidth={stroke} />
          <circle
            cx={center}
            cy={center}
            r={r}
            fill="none"
            stroke={arcColor}
            strokeWidth={stroke}
            strokeDasharray={circumference}
            strokeDashoffset={dashOffset}
            strokeLinecap="round"
            style={{ transition: 'stroke-dashoffset 0.6s ease, stroke 0.3s ease' }}
          />
        </g>
      </svg>
      <div
        style={{
          position: 'absolute',
          inset: 0,
          display: 'flex',
          flexDirection: 'column',
          alignItems: 'center',
          justifyContent: 'center',
        }}
      >
        <div style={{ fontFamily: FONT_MONO, fontSize: size * 0.2, fontWeight: 600, color: PALETTE.text, lineHeight: 1 }}>
          {Math.round(value)}
        </div>
        <div style={{ fontFamily: FONT_MONO, fontSize: 13, color: PALETTE.textMuted, marginTop: 4 }}>/ {goal} kcal</div>
        {label && (
          <div style={{ fontSize: 11, color: PALETTE.textMuted, marginTop: 6, letterSpacing: 1.5, textTransform: 'uppercase' }}>
            {label}
          </div>
        )}
      </div>
    </div>
  );
}

function WeekBars({ data, goal }) {
  const max = Math.max(goal, ...data.map((d) => d.kcal), 1);
  const chartH = 120;
  const goalY = chartH - (goal / max) * chartH;
  return (
    <div style={{ position: 'relative', paddingTop: 4 }}>
      <div style={{ position: 'absolute', left: 0, right: 0, top: goalY + 4, borderTop: `1px dashed ${PALETTE.sage}` }} />
      <div style={{ display: 'flex', alignItems: 'flex-end', gap: 8, height: chartH }}>
        {data.map((d) => {
          const h = (d.kcal / max) * chartH;
          const over = d.kcal > goal;
          return (
            <div key={d.date} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', flex: 1, height: '100%', justifyContent: 'flex-end' }}>
              <div
                style={{
                  width: '100%',
                  height: Math.max(h, 2),
                  background: d.kcal > 0 ? (over ? PALETTE.paprika : PALETTE.honey) : PALETTE.track,
                  borderRadius: 5,
                  transition: 'height .5s ease',
                }}
              />
            </div>
          );
        })}
      </div>
      <div style={{ display: 'flex', gap: 8, marginTop: 6 }}>
        {data.map((d) => (
          <div key={d.date} style={{ flex: 1, textAlign: 'center', fontSize: 10, color: PALETTE.textMuted }}>
            {weekdayLabel(d.date)}
          </div>
        ))}
      </div>
    </div>
  );
}

function WeightChart({ weights }) {
  const sorted = [...weights].sort((a, b) => (a.date < b.date ? -1 : 1));
  if (sorted.length < 2) {
    return <p style={{ fontSize: 13, color: PALETTE.textMuted }}>Registre pelo menos 2 pesagens pra ver a tendência.</p>;
  }
  const w = 300, h = 130, pad = 22;
  const kgs = sorted.map((p) => p.kg);
  const min = Math.min(...kgs, 85) - 2;
  const max = Math.max(...kgs) + 2;
  const xStep = (w - pad * 2) / (sorted.length - 1);
  const yFor = (kg) => h - pad - ((kg - min) / (max - min)) * (h - pad * 2);
  const points = sorted.map((pt, i) => `${pad + i * xStep},${yFor(pt.kg)}`).join(' ');
  const goalY = yFor(85);
  const goalY90 = yFor(90);
  return (
    <svg width="100%" viewBox={`0 0 ${w} ${h}`} style={{ overflow: 'visible' }}>
      <line x1={pad} y1={goalY90} x2={w - pad} y2={goalY90} stroke={PALETTE.textMuted} strokeDasharray="3 4" strokeWidth="1" />
      <line x1={pad} y1={goalY} x2={w - pad} y2={goalY} stroke={PALETTE.sage} strokeDasharray="3 4" strokeWidth="1" />
      <polyline points={points} fill="none" stroke={PALETTE.honey} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      {sorted.map((pt, i) => (
        <circle key={i} cx={pad + i * xStep} cy={yFor(pt.kg)} r="3.5" fill={PALETTE.honey} />
      ))}
    </svg>
  );
}

      ingredients = [{ id: entry.foodId, g: entry.grams }];

      setPantry(nextPantry);

  function undoPurchase(purchase) {
    const nextStock = { ...pantry.stock, [purchase.itemId]: Math.max(0, (pantry.stock[purchase.itemId] || 0) - purchase.grams) };
    const nextPurchases = pantry.recentPurchases.filter((p) => p.ts !== purchase.ts);
    const nextUnitSizes = { ...pantry.unitSizes };
    const nextWarned = { ...pantry.warned };
    const stillHasPurchase = nextPurchases.some((p) => p.itemId === purchase.itemId);
    if (!stillHasPurchase && nextStock[purchase.itemId] <= 0) {
      delete nextUnitSizes[purchase.itemId];
      delete nextWarned[purchase.itemId];
    }
    const next = { stock: nextStock, warned: nextWarned, recentPurchases: nextPurchases, unitSizes: nextUnitSizes };

                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                      {items.map((p) => {
                        const stock = pantry.stock[p.id] || 0;
                        const gpu = pantry.unitSizes[p.id] || p.gramsPerUnit;
                        const tracked = pantry.unitSizes[p.id] !== undefined;
                        const isEmptyFlag = tracked && stock <= 0;
                        const isLowFlag = tracked && stock > 0 && stock <= p.threshold;
                        const empty = stock <= 0;
                        const isEditing = editingStockId === p.id;
                        return (
                          <div key={p.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8 }}>
                            <span style={{ fontSize: 13, color: empty ? PALETTE.textMuted : PALETTE.text }}>{p.name}</span>
                            {isEditing ? (
                              <div style={{ display: 'flex', alignItems: 'center', gap: 4, flexShrink: 0 }}>
                                <input
                                  type="number"
                                  autoFocus
                                  value={editingStockValue}
                                  onChange={(e) => setEditingStockValue(e.target.value)}
                                  style={{ width: 56, background: PALETTE.surfaceAlt, border: `1px solid ${PALETTE.honey}`, borderRadius: 6, color: PALETTE.text, padding: '3px 6px', fontSize: 12, fontFamily: FONT_MONO }}
                                />
                                <span style={{ fontSize: 11, color: PALETTE.textMuted }}>{p.unit}</span>
                                <button
                                  onClick={() => { setStockDirectly(p.id, editingStockValue); setEditingStockId(null); }}
                                  style={{ background: 'none', border: 'none', color: PALETTE.sage, cursor: 'pointer', padding: 2, fontWeight: 800, fontSize: 14 }}
                                >
                                  ✓
                                </button>
                                <button onClick={() => setEditingStockId(null)} style={{ background: 'none', border: 'none', color: PALETTE.textMuted, cursor: 'pointer', padding: 2 }}>
                                  <X size={13} />
                                </button>
                              </div>
                            ) : (
                              <button
                                onClick={() => { setEditingStockId(p.id); setEditingStockValue(String(Math.round((stock / gpu) * 10) / 10)); }}
                                style={{
                                  background: 'none',
                                  border: 'none',
                                  cursor: 'pointer',
                                  padding: 0,
                                  fontFamily: FONT_MONO,
                                  fontSize: 12,
                                  fontWeight: isEmptyFlag || isLowFlag ? 700 : 400,
                                  color: isEmptyFlag ? PALETTE.paprika : isLowFlag ? PALETTE.honey : empty ? PALETTE.textMuted : PALETTE.text,
                                  textDecoration: 'underline',
                                  textDecorationStyle: 'dotted',
                                  textUnderlineOffset: '3px',
                                }}
                              >
                                {formatStock(p, stock, gpu)}
                              </button>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}

              {pantry.recentPurchases.length > 0 && (
                <div style={cardStyle()}>
                  <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 0.8, textTransform: 'uppercase', color: PALETTE.textMuted, marginBottom: 4 }}>
                    Últimas compras
                  </div>
                  <div style={{ fontSize: 11, color: PALETTE.textMuted, marginBottom: 10 }}>Errou a quantidade? Toque no X pra desfazer.</div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                    {pantry.recentPurchases.map((pu) => (
                      <div key={pu.ts} style={{ fontSize: 12.5, color: PALETTE.textMuted, display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8 }}>
                        <span style={{ flex: 1 }}>{pu.name}</span>
                        <span style={{ fontFamily: FONT_MONO }}>+{pu.amount} {pu.unit}</span>
                        <button onClick={() => undoPurchase(pu)} style={{ background: 'none', border: 'none', color: PALETTE.textMuted, cursor: 'pointer', padding: 2, flexShrink: 0 }}>
                          <X size={13} />
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}

          {tab === 'progresso' && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
              <div style={cardStyle()}>
                <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 0.8, textTransform: 'uppercase', color: PALETTE.textMuted, marginBottom: 10 }}>Últimos 7 dias (kcal)</div>
                <WeekBars data={week} goal={settings.kcalGoal} />
              </div>

              <div style={cardStyle()}>
                <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 0.8, textTransform: 'uppercase', color: PALETTE.textMuted, marginBottom: 10 }}>Peso</div>
                <WeightChart weights={weights} />
                <div style={{ display: 'flex', gap: 8, marginTop: 14 }}>
                  <input
                    type="number"
                    placeholder="peso de hoje (kg)"
                    value={weightInput}
                    onChange={(e) => setWeightInput(e.target.value)}
                    style={{ flex: 1, background: PALETTE.surfaceAlt, border: `1px solid ${PALETTE.border}`, borderRadius: 10, color: PALETTE.text, padding: '9px 10px', fontSize: 13 }}
                  />
                  <button onClick={saveWeight} style={{ padding: '9px 16px', borderRadius: 10, border: 'none', background: PALETTE.honey, color: '#1B1815', fontWeight: 800, fontSize: 13, cursor: 'pointer' }}>
                    Salvar
                  </button>
                </div>
              </div>

              <div style={cardStyle()}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 0.8, textTransform: 'uppercase', color: PALETTE.textMuted }}>Metas diárias</div>
                  {!settingsForm && (
                    <button
                      onClick={() => setSettingsForm({ kcalGoal: settings.kcalGoal, proteinGoal: settings.proteinGoal, waterGoalMl: settings.waterGoalMl })}
                      style={{ background: 'none', border: 'none', color: PALETTE.honey, fontSize: 12, fontWeight: 700, cursor: 'pointer' }}
                    >
                      editar
                    </button>
                  )}
                </div>
                {!settingsForm ? (
                  <div style={{ fontSize: 13, lineHeight: 1.8, color: PALETTE.textMuted }}>
                    <div>Calorias: <strong style={{ color: PALETTE.text }}>{settings.kcalGoal} kcal</strong></div>
                    <div>Proteína: <strong style={{ color: PALETTE.text }}>{settings.proteinGoal}g</strong></div>
                    <div>Água: <strong style={{ color: PALETTE.text }}>{settings.waterGoalMl / 1000}L</strong></div>
                  </div>
                ) : (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                    <label style={{ fontSize: 12, color: PALETTE.textMuted }}>
                      Calorias (kcal)
                      <input
                        type="number"
                        value={settingsForm.kcalGoal}
                        onChange={(e) => setSettingsForm({ ...settingsForm, kcalGoal: e.target.value })}
                        style={{ width: '100%', marginTop: 4, background: PALETTE.surfaceAlt, border: `1px solid ${PALETTE.border}`, borderRadius: 10, color: PALETTE.text, padding: '8px 10px', fontSize: 13 }}
                      />
                    </label>
                    <label style={{ fontSize: 12, color: PALETTE.textMuted }}>
                      Proteína (g)
                      <input
                        type="number"
                        value={settingsForm.proteinGoal}
                        onChange={(e) => setSettingsForm({ ...settingsForm, proteinGoal: e.target.value })}
                        style={{ width: '100%', marginTop: 4, background: PALETTE.surfaceAlt, border: `1px solid ${PALETTE.border}`, borderRadius: 10, color: PALETTE.text, padding: '8px 10px', fontSize: 13 }}
                      />
                    </label>
                    <label style={{ fontSize: 12, color: PALETTE.textMuted }}>
                      Água (ml)
                      <input
                        type="number"
                        value={settingsForm.waterGoalMl}
                        onChange={(e) => setSettingsForm({ ...settingsForm, waterGoalMl: e.target.value })}
                        style={{ width: '100%', marginTop: 4, background: PALETTE.surfaceAlt, border: `1px solid ${PALETTE.border}`, borderRadius: 10, color: PALETTE.text, padding: '8px 10px', fontSize: 13 }}
                      />
                    </label>
                    <div style={{ display: 'flex', gap: 8, marginTop: 4 }}>
                      <button onClick={() => setSettingsForm(null)} style={{ flex: 1, padding: '9px 0', borderRadius: 10, border: `1px solid ${PALETTE.border}`, background: 'transparent', color: PALETTE.textMuted, fontSize: 13, cursor: 'pointer' }}>
                        Cancelar
                      </button>
                      <button onClick={saveSettingsForm} style={{ flex: 1, padding: '9px 0', borderRadius: 10, border: 'none', background: PALETTE.honey, color: '#1B1815', fontWeight: 800, fontSize: 13, cursor: 'pointer' }}>
                        Salvar
                      </button>
                    </div>
                  </div>
                )}
              </div>

              <button
                onClick={resetAllData}
                style={{
                  background: 'none',
                  border: `1px solid ${PALETTE.border}`,
                  borderRadius: 14,
                  color: PALETTE.textMuted,
                  fontSize: 12.5,
                  padding: '10px 14px',
                  cursor: 'pointer',
                  textAlign: 'center',
                }}
              >
                Zerar todos os dados e recomeçar
              </button>
            </div>
          )}
        </div>

        {/* Bottom nav */}
        <div
          style={{
            position: 'sticky',
            bottom: 0,
            background: PALETTE.surface,
            borderTop: `1px solid ${PALETTE.border}`,
            display: 'flex',
            padding: '8px 8px calc(8px + env(safe-area-inset-bottom, 0px))',
            gap: 2,
          }}
        >
          {[
            { id: 'hoje', label: 'Hoje', Icon: Home },
            { id: 'refeicoes', label: 'Refeições', Icon: UtensilsCrossed },
            { id: 'despensa', label: 'Despensa', Icon: Package },
            { id: 'progresso', label: 'Progresso', Icon: TrendingUp },
          ].map(({ id, label, Icon }) => (
            <button
              key={id}
              onClick={() => setTab(id)}
              style={{
                flex: 1,
                display: 'flex',
                flexDirection: 'column',
                alignItems: 'center',
                gap: 3,
                padding: '8px 0 6px',
                borderRadius: 12,
                border: 'none',
                background: tab === id ? PALETTE.surfaceAlt : 'transparent',
                color: tab === id ? PALETTE.honey : PALETTE.textMuted,
                cursor: 'pointer',
                position: 'relative',
              }}
            >
              <Icon size={18} />
              <span style={{ fontSize: 10, fontWeight: 700 }}>{label}</span>
              {id === 'despensa' && (emptyStockItems.length > 0 || lowStockItems.length > 0) && (
                <span
                  style={{
                    position: 'absolute',
                    top: 4,
                    right: '28%',
                    width: 8,
                    height: 8,
                    borderRadius: '50%',
                    background: PALETTE.paprika,
                  }}
                />
              )}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(<App />);
</script>

  var src = document.getElementById('app-source').textContent;

  (0, eval)(out);
</script>
</body>

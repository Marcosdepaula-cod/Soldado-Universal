function resolveLowestStock(stock, candidates) {
  let best = candidates[0];
  let bestVal = stock[best] ?? 0;
  for (const c of candidates.slice(1)) {
    const v = stock[c] ?? 0;
    if (v < bestVal) { best = c; bestVal = v; }
  }
  return best;
}

function computeDecrements(ingredients, stock) {
  const out = [];
  for (const ing of ingredients) {
    if (ing.id) out.push({ id: ing.id, grams: ing.g });
    else if (ing.fruit) out.push({ id: resolveLowestStock(stock, FRUIT_IDS), grams: ing.fruit });
    else if (ing.fruitChoice) out.push({ id: resolveLowestStock(stock, ing.fruitChoice), grams: ing.g });
  }
  return out;
}

function applyDecrements(pantry, decrements) {
  const stock = { ...pantry.stock };
  const warned = { ...pantry.warned };
  const newlyLow = [];
  for (const d of decrements) {
    const item = PANTRY_ITEMS.find((p) => p.id === d.id);
    if (!item) continue;
    const yieldFactor = item.yieldFactor || 1;
    const rawGrams = d.grams / yieldFactor;
    const prev = stock[d.id] ?? 0;
    const next = Math.max(0, prev - rawGrams);
    stock[d.id] = next;
    if (prev > item.threshold && next <= item.threshold && !warned[d.id]) {
      newlyLow.push(item.name);
      warned[d.id] = true;
    }
  }
  return { stock, warned, newlyLow };
}

function formatStock(item, stockGrams, gramsPerUnitOverride) {
  const gpu = gramsPerUnitOverride || item.gramsPerUnit;
  const amount = stockGrams / gpu;
  const rounded = amount < 10 ? Math.round(amount * 10) / 10 : Math.round(amount);
  if (item.isPackage) {
    return `${rounded} pacote${rounded === 1 ? '' : 's'} (${Math.round(stockGrams)}g)`;
  }
  return `${rounded} ${item.unit}`;
}

// Credita (ou remove, com delta negativo) gramas "cruas" no estoque de um item — usado quando a Lista de
// Compras é marcada/desmarcada, pra manter a despensa em dia sem precisar passar pelo "Registrar compra".
function creditPantryStock(pantry, itemId, deltaGrams) {
  const item = PANTRY_ITEMS.find((p) => p.id === itemId);
  if (!item) return pantry;
  const stock = { ...pantry.stock };
  const warned = { ...pantry.warned };
  const prev = stock[itemId] ?? 0;
  const next = Math.max(0, prev + deltaGrams);
  stock[itemId] = next;
  if (next > item.threshold) warned[itemId] = false;
  return { ...pantry, stock, warned };
}

/* ---------- Números em pt-BR ---------- */
const NF_INT = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });
const NF_MONEY = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const NF_BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
function fmtInt(n) {
  return NF_INT.format(Math.round(Number(n) || 0));
}
function fmtNum(n, maxDigits = 1) {
  return new Intl.NumberFormat('pt-BR', { maximumFractionDigits: maxDigits }).format(Number(n) || 0);
}
function fmtMoney(n) {
  return NF_MONEY.format(Number(n) || 0);
}
function formatBRL(n) {
  return NF_BRL.format(Number(n) || 0);
}
// Aceita "0,916", "10.99" e "1.234,56": com vírgula, ela é o decimal; sem vírgula, o ponto é o decimal.
function parseNum(v) {
  if (typeof v === 'number') return Number.isFinite(v) ? v : 0;
  const s = String(v ?? '').trim();
  if (!s) return 0;
  const norm = s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s;
  const n = parseFloat(norm);
  return Number.isFinite(n) ? n : 0;
}
function round2(n) {
  return Math.round((Number(n) || 0) * 100) / 100;
}
function fmtDayMonth(dateKey) {
  const [, m, d] = String(dateKey).split('-');
  return `${d}/${m}`;
}
function fmtDateFull(dateKey) {
  const [y, m, d] = String(dateKey).split('-');
  return `${d}/${m}/${y}`;
}

// Gramas que um lançamento põe na despensa.
function entryGrams(item, e) {
  if (!item || !e) return 0;
  const qty = parseNum(e.qty);
  if (e.unit === 'kg') return qty * 1000;
  return qty * parseNum(e.size) * (item.sizeGrams || 1);
}

// Migração da lista antiga (marcar = quantidade cheia do plano) pro formato de cupom.
// Itens que estavam marcados e aparecem no cupom de 24/11/2026 (Supermercados Cavicchiolli) viram os lançamentos
// reais daquela compra, e a despensa é corrigida pela diferença (antes tinha entrado a quantidade cheia do plano).
// Outros itens marcados viram um lançamento com a quantidade do plano e o valor que estava no campo.
const LEGACY_SHOPPING_TARGETS = {

};
const LEGACY_PRICE_EST = { acem: 35.19, carne_moida: 32, frango: 15.2, lombo: 19.2, tilapia: 40, arroz: 6, feijao: 8.5, lentilha: 8, macarrao: 4.5, ovos: 32, pao: 24, mussarela: 22 };

function migrateShopping(raw, pantry, todayKey) {
  if (raw && raw.v === 2) {
    return {
      shopping: { v: 2, startDate: raw.startDate || todayKey, entries: raw.entries || [], history: raw.history || [] },
      pantry,
      changed: false,
    };
  }
  const checked = (raw && raw.checked) || {};
  const prices = (raw && raw.prices) || {};
  const shopping = emptyShopping(todayKey);
  const deltas = {}; // diferença líquida por item da despensa
  const addDelta = (pantryId, grams) => {
    deltas[pantryId] = (deltas[pantryId] || 0) + grams;
  };
  let seq = 0;
  const newId = () => `m${Date.now().toString(36)}${(seq++).toString(36)}`;

  for (const oldKey of Object.keys(checked)) {
    if (!checked[oldKey]) continue;
    const oldTargets = LEGACY_SHOPPING_TARGETS[oldKey] || [];
    const receipt = RECEIPT_2026_11_24[oldKey];
    if (receipt) {
      oldTargets.forEach(([pid, g]) => addDelta(pid, -g)); // tira a quantidade cheia que a lista antiga creditou
      receipt.forEach((r) => {
        const item = shopItem(r.key);
        if (!item) return;
        const e = { id: newId(), key: r.key, date: '2026-11-24', qty: r.qty, unit: r.unit, price: r.price, size: r.size || '' };
        shopping.entries.push(e);
        addDelta(item.pantryId, entryGrams(item, e));
      });
    } else {
      // Marcado, mas fora do cupom: vira um lançamento com a quantidade do plano (o crédito já está na despensa).
      const item = shopItem(oldKey);
      if (!item) continue;
      const grams = oldTargets.reduce((s, [, g]) => s + g, 0);
      const paid = prices[oldKey] !== undefined && prices[oldKey] !== '' ? parseNum(prices[oldKey]) : LEGACY_PRICE_EST[oldKey] || 0;
      let e;
      if (item.unit === 'kg') {
        const qty = grams / 1000;
        e = { qty: fmtNum(qty, 3), unit: 'kg', price: qty > 0 ? fmtMoney(paid / qty) : '', size: '' };
      } else {
        const per = (item.size || 1) * (item.sizeGrams || 1);
        const qty = per > 0 ? grams / per : 1;
        e = { qty: fmtNum(qty, 2), unit: 'un', price: qty > 0 ? fmtMoney(paid / qty) : '', size: String(item.size || '') };
      }
      shopping.entries.push({ id: newId(), key: oldKey, date: todayKey, note: 'veio da lista antiga, confira', ...e });
    }
  }

  let nextPantry = pantry;
  Object.keys(deltas).forEach((pid) => {
    if (deltas[pid] !== 0) nextPantry = creditPantryStock(nextPantry, pid, deltas[pid]);
  });
  const dates = shopping.entries.map((e) => e.date).sort();
  if (dates.length) shopping.startDate = dates[0];
  return { shopping, pantry: nextPantry, changed: true };
}

function getLastNDates(n) {
  const arr = [];
  for (let i = n - 1; i >= 0; i--) {

    d.setDate(d.getDate() - i);
    arr.push(formatDateKey(d));

}

/* Medidor de calorias no formato de termômetro de cozinha: o arco tem a faixa "no ponto" (logo abaixo da meta)
   e a zona de "passou". O ponteiro mostra onde o dia está. */
function arcPoint(cx, cy, r, deg) {
  const rad = (deg * Math.PI) / 180;
  return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
}
function arcPath(cx, cy, r, fromDeg, toDeg) {
  const [x1, y1] = arcPoint(cx, cy, r, fromDeg);
  const [x2, y2] = arcPoint(cx, cy, r, toDeg);
  const large = toDeg - fromDeg > 180 ? 1 : 0;
  return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
}
function PontoDial({ value, goal }) {
  const W = 320, H = 238, cx = 160, cy = 140, r = 112, stroke = 14;
  const START = 135, SWEEP = 270;
  const max = Math.max(goal * 1.2, 1);
  const angleFor = (v) => START + SWEEP * Math.min(Math.max(v / max, 0), 1);
  const remaining = goal - value;
  const over = remaining < 0;
  const inPonto = !over && remaining <= PONTO_BAND && value > 0;
  const pct = Math.min(Math.max(value / max, 0), 1) * 100;
  const [mx, my] = arcPoint(cx, cy, r, angleFor(value));
  const [gx1, gy1] = arcPoint(cx, cy, r - stroke / 2 - 7, angleFor(goal));
  const [gx2, gy2] = arcPoint(cx, cy, r + stroke / 2 + 5, angleFor(goal));
  const goalCos = Math.cos((angleFor(goal) * Math.PI) / 180);
  const [lx, ly] = arcPoint(cx, cy, r + stroke / 2 + 12, angleFor(goal));
  const labelAnchor = goalCos > 0.3 ? 'start' : goalCos < -0.3 ? 'end' : 'middle';
  const ticks = [];
  for (let i = 0; i <= 12; i++) {
    const deg = START + (SWEEP * i) / 12;
    const [a, b] = arcPoint(cx, cy, r - stroke / 2 - 6, deg);
    const [c, d] = arcPoint(cx, cy, r - stroke / 2 - 12, deg);
    ticks.push(<line key={i} x1={a} y1={b} x2={c} y2={d} stroke={PALETTE.border} strokeWidth="2" strokeLinecap="round" />);
  }
  const statusText = over ? `passou ${fmtInt(-remaining)} kcal` : inPonto ? 'no ponto' : `faltam ${fmtInt(remaining)} kcal`;
  const statusColor = over ? PALETTE.paprika : inPonto ? PALETTE.honey : PALETTE.textMuted;
  const arcColor = over ? PALETTE.paprika : PALETTE.honey;
  return (
    <div role="img" aria-label={`${fmtInt(value)} de ${fmtInt(goal)} kcal hoje, ${statusText}`} style={{ position: 'relative', width: W, height: H, maxWidth: '100%', flexShrink: 0 }}>
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} aria-hidden="true" style={{ maxWidth: '100%', height: 'auto' }}>
        {ticks}
        <path d={arcPath(cx, cy, r, START, START + SWEEP)} fill="none" stroke={PALETTE.track} strokeWidth={stroke} strokeLinecap="round" />
        <path d={arcPath(cx, cy, r, angleFor(Math.max(goal - PONTO_BAND, 0)), angleFor(goal))} fill="none" stroke={PALETTE.honey} strokeOpacity="0.32" strokeWidth={stroke} />
        <path d={arcPath(cx, cy, r, angleFor(goal), START + SWEEP)} fill="none" stroke={PALETTE.paprika} strokeOpacity="0.24" strokeWidth={stroke} strokeLinecap="round" />
        <path
          d={arcPath(cx, cy, r, START, START + SWEEP)}
          pathLength="100"
          fill="none"
          stroke={arcColor}
          strokeWidth={stroke}
          strokeLinecap="round"
          strokeDasharray={`${pct} 100`}
          style={{ transition: 'stroke-dasharray 0.6s ease, stroke 0.3s ease', opacity: value > 0 ? 1 : 0 }}
        />
        <line x1={gx1} y1={gy1} x2={gx2} y2={gy2} stroke={PALETTE.text} strokeWidth="2.5" strokeLinecap="round" />
        <text x={lx} y={ly} fill={PALETTE.textMuted} fontSize="12" fontWeight="600" textAnchor={labelAnchor} dominantBaseline="middle" style={{ fontFamily: FONT_SANS }}>meta</text>
        {value > 0 && (
          <g style={{ transform: `translate(${mx}px, ${my}px)`, transition: 'transform 0.6s ease' }}>
            <circle r="10" fill={PALETTE.bg} stroke={arcColor} strokeWidth="3.5" />
          </g>
        )}
      </svg>
      <div style={{ position: 'absolute', left: 0, right: 0, top: cy - 52, textAlign: 'center' }}>
        <div style={{ ...CONDENSED, fontSize: 66, fontWeight: 800, lineHeight: 1, letterSpacing: -1 }}>{fmtInt(value)}</div>
        <div style={{ fontSize: 15, color: PALETTE.textMuted, marginTop: 6 }}>de {fmtInt(goal)} kcal</div>
        <div style={{ fontSize: 16, fontWeight: 700, color: statusColor, marginTop: 10 }}>{statusText}</div>
      </div>
    </div>
  );
}

// Horário de uma refeição do plano (no fim de semana, almoço e pré-treino mudam).
function slotClock(mt, weekend) {
  const src = weekend && mt.weekendTime ? mt.weekendTime : mt.time;
  if (!src) return null;
  const m = String(src).match(/(\d{1,2}):(\d{2})/);
  return m ? `${m[1].padStart(2, '0')}:${m[2]}` : null;
}

// Linha do tempo com os 6 horários do plano: registrado (sálvia), próxima (mel), pendente.
function MealTimeline({ meals, weekend, onPick }) {
  const slots = MEAL_TYPES.filter((mt) => mt.id !== 'bebida');
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const logged = new Set(meals.map((m) => m.mealType));
  let nextId = null;
  for (const s of slots) {
    const c = slotClock(s, weekend);
    if (logged.has(s.id) || !c) continue;
    const [h, mi] = c.split(':').map(Number);
    if (h * 60 + mi >= nowMin - 60) {
      nextId = s.id;
      break;
    }
  }
  return (
    <ol style={{ listStyle: 'none', margin: 0, padding: 0, display: 'grid', gridTemplateColumns: `repeat(${slots.length}, minmax(0, 1fr))`, position: 'relative' }}>
      <span aria-hidden="true" style={{ position: 'absolute', left: `${50 / slots.length}%`, right: `${50 / slots.length}%`, top: 30, height: 2, background: PALETTE.border }} />
      {slots.map((s) => {
        const done = logged.has(s.id);
        const isNext = s.id === nextId;
        const clock = slotClock(s, weekend);
        return (
          <li key={s.id} style={{ position: 'relative', minWidth: 0 }}>
            <button
              type="button"
              onClick={() => onPick(s.id)}
              aria-label={`${s.label}, ${clock || ''}${done ? ', registrado' : isNext ? ', próxima refeição' : ''}`}
              style={{ width: '100%', background: 'transparent', border: 'none', padding: '0 0 6px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, cursor: 'pointer', color: PALETTE.text, minHeight: 72 }}
            >
              <span style={{ fontSize: 12.5, fontWeight: 600, color: isNext ? PALETTE.honey : PALETTE.textMuted }}>{clock}</span>
              <span
                style={{
                  width: 22,
                  height: 22,
                  borderRadius: '50%',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  background: done ? PALETTE.sage : PALETTE.bg,
                  border: `2px solid ${done ? PALETTE.sage : isNext ? PALETTE.honey : PALETTE.border}`,
                  color: PALETTE.bg,
                  position: 'relative',
                  zIndex: 1,
                }}
              >
                {done && <Check size={13} />}
              </span>
              <span style={{ ...CONDENSED, fontSize: 13.5, fontWeight: 700, color: done || isNext ? PALETTE.text : PALETTE.textMuted, whiteSpace: 'nowrap' }}>
                {SLOT_SHORT[s.id] || s.label}
              </span>
            </button>
          </li>
        );
      })}
    </ol>
  );
}

    return <p style={{ margin: 0, fontSize: 15, color: PALETTE.textMuted, lineHeight: 1.5 }}>Registre pelo menos 2 pesagens pra ver a tendência.</p>;
  }
  const w = 300, h = 140, pad = 24;
  const kgs = sorted.map((p) => p.kg);
  const min = Math.min(...kgs, 85) - 2;
  const max = Math.max(...kgs) + 2;
  const xStep = (w - pad * 2) / (sorted.length - 1);
  const yFor = (kg) => h - pad - ((kg - min) / (max - min)) * (h - pad * 2);
  const points = sorted.map((pt, i) => `${pad + i * xStep},${yFor(pt.kg)}`).join(' ');
  return (
    <svg width="100%" viewBox={`0 0 ${w} ${h}`} style={{ overflow: 'visible' }} role="img" aria-label={`Peso de ${fmtNum(sorted[0].kg, 1)} kg até ${fmtNum(sorted[sorted.length - 1].kg, 1)} kg`}>
      <line x1={pad} y1={yFor(90)} x2={w - pad} y2={yFor(90)} stroke={PALETTE.textMuted} strokeDasharray="3 4" strokeWidth="1" />
      <text x={w - pad + 4} y={yFor(90)} fill={PALETTE.textMuted} fontSize="11" dominantBaseline="middle" style={{ fontFamily: FONT_SANS }}>90</text>
      <line x1={pad} y1={yFor(85)} x2={w - pad} y2={yFor(85)} stroke={PALETTE.sage} strokeDasharray="3 4" strokeWidth="1" />
      <text x={w - pad + 4} y={yFor(85)} fill={PALETTE.sage} fontSize="11" dominantBaseline="middle" style={{ fontFamily: FONT_SANS }}>85</text>
      <polyline points={points} fill="none" stroke={PALETTE.honey} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      {sorted.map((pt, i) => (
        <circle key={i} cx={pad + i * xStep} cy={yFor(pt.kg)} r="3.5" fill={PALETTE.honey} />
      ))}
    </svg>
  );
}

  function normalizeText(s) {
    return s
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .trim();
  }

  function parseFreeText(text) {
    const normalized = text.replace(/\s+e\s+/gi, ', ').replace(/\s+com\s+/gi, ', ');
    const segments = normalized
      .split(/[,;]|(?<=\))\s*/)
      .map((s) => s.replace(/^[()]+|[()]+$/g, '').trim())
      .filter(Boolean);
    const matched = [];
    const unmatched = [];
    for (const seg of segments) {
      const m = seg.match(/^(\d+(?:[.,]\d+)?)\s*(gramas?|g|ml|mililitros?|unidades?|un\.?)?\s*(?:de|do|da)?\s*(.+)$/i);
      if (!m) {
        if (seg.length > 1) unmatched.push(seg);
        continue;
      }
      const qty = parseFloat(m[1].replace(',', '.'));
      const unitHint = (m[2] || '').toLowerCase();
      const isUnitHint = unitHint.startsWith('un');
      const namePart = normalizeText(m[3]);
      const food = FOODS.find((f) => {
        const fname = normalizeText(f.name);
        return fname.includes(namePart) || namePart.includes(fname.split(' ')[0]) || namePart.includes(fname.split('(')[0].trim());
      });
      if (!food) {
        unmatched.push(seg);
        continue;
      }
      let kcal, prot;
      if (isUnitHint && food.kcalFixed) {
        kcal = Math.round(food.kcalFixed * qty);
        prot = Math.round((food.protFixed || 0) * qty * 10) / 10;
      } else {
        kcal = Math.round((food.kcal100 / 100) * qty);
        prot = Math.round((food.prot100 / 100) * qty * 10) / 10;
      }
      const grams = isUnitHint ? null : qty;
      matched.push({ id: food.id, name: food.name, qty, isUnitHint, kcal, prot, grams });
    }
    return { matched, unmatched };
  }

  function detectFromDescription() {
    if (!freeDescription.trim()) return;
    const { matched, unmatched } = parseFreeText(freeDescription);
    if (matched.length === 0) {
      setToast('Não reconheci nenhum item — digite kcal/proteína direto, ou use a busca de ingredientes abaixo.');
      return;
    }
    const kcalSum = matched.reduce((s, m) => s + m.kcal, 0);
    const protSum = matched.reduce((s, m) => s + m.prot, 0);
    setFreeKcal(String(Math.round(kcalSum)));
    setFreeProt(String(Math.round(protSum * 10) / 10));
    const newIngredients = matched
      .filter((m) => PANTRY_ITEMS.some((p) => p.id === m.id) && m.grams)
      .map((m) => ({ id: m.id, name: m.name, grams: m.grams, display: `${m.qty}g` }));
    if (newIngredients.length > 0) {
      setFreeIngredients((prev) => [...prev, ...newIngredients]);
    }
    const total = matched.length + unmatched.length;
    setToast(
      unmatched.length > 0
        ? `Reconheci ${matched.length} de ${total}: ${matched.map((m) => m.name.split(' ')[0]).join(', ')}. Não achei: ${unmatched.join(', ')}`

  }

  function undoPurchase(purchase) {
    const nextStock = { ...pantry.stock, [purchase.itemId]: Math.max(0, (pantry.stock[purchase.itemId] || 0) - purchase.grams) };
    const nextPurchases = pantry.recentPurchases.filter((p) => p.ts !== purchase.ts);
    const nextUnitSizes = { ...pantry.unitSizes };
    const nextWarned = { ...pantry.warned };
    const nextConsumptionSeen = { ...pantry.consumptionSeen, [purchase.itemId]: false };
    const stillHasPurchase = nextPurchases.some((p) => p.itemId === purchase.itemId);
    if (!stillHasPurchase && nextStock[purchase.itemId] <= 0) {
      delete nextUnitSizes[purchase.itemId];
      delete nextWarned[purchase.itemId];
    }
    const next = { ...pantry, stock: nextStock, warned: nextWarned, recentPurchases: nextPurchases, unitSizes: nextUnitSizes, consumptionSeen: nextConsumptionSeen };
    setPantry(next);
    saveJSON('pantry', next);
    setToast(`Compra de ${purchase.name} desfeita`);

  function setStockDirectly(itemId, newDisplayAmount, newWeight) {
    const item = PANTRY_ITEMS.find((p) => p.id === itemId);
    if (!item) return;
    const gpu = Number(newWeight) > 0 ? Number(newWeight) : pantry.unitSizes[itemId] || item.gramsPerUnit;
    const grams = Math.max(0, Number(newDisplayAmount)) * gpu;
    const nextStock = { ...pantry.stock, [itemId]: grams };
    const nextWarned = { ...pantry.warned };
    const nextUnitSizes = { ...pantry.unitSizes, [itemId]: gpu };
    const nextConsumptionSeen = { ...pantry.consumptionSeen, [itemId]: false };
    if (grams > item.threshold) nextWarned[itemId] = false;
    const next = { ...pantry, stock: nextStock, warned: nextWarned, unitSizes: nextUnitSizes, consumptionSeen: nextConsumptionSeen };
    setPantry(next);
    saveJSON('pantry', next);
    setToast(`${item.name} corrigido`);
  }

  function addPantryPurchase() {
    if (!selectedPantryItem || !pantryAmount || Number(pantryAmount) <= 0) return;
    const unitSize = Number(pantryUnitSize) > 0 ? Number(pantryUnitSize) : selectedPantryItem.gramsPerUnit;
    const grams = Number(pantryAmount) * unitSize;
    const nextStock = { ...pantry.stock, [selectedPantryItem.id]: (pantry.stock[selectedPantryItem.id] || 0) + grams };
    const nextWarned = { ...pantry.warned };
    if (nextStock[selectedPantryItem.id] > selectedPantryItem.threshold) nextWarned[selectedPantryItem.id] = false;
    const nextUnitSizes = { ...pantry.unitSizes, [selectedPantryItem.id]: unitSize };
    const nextPurchases = [
      { ts: Date.now(), itemId: selectedPantryItem.id, name: selectedPantryItem.name, amount: pantryAmount, unit: selectedPantryItem.unit, grams },
      ...pantry.recentPurchases,
    ].slice(0, 8);
    const next = { ...pantry, stock: nextStock, warned: nextWarned, recentPurchases: nextPurchases, unitSizes: nextUnitSizes };
    setPantry(next);
    saveJSON('pantry', next);
    setToast(`${selectedPantryItem.name} adicionado à despensa`);
    setSelectedPantryItem(null);
    setPantryAmount('');
    setPantryUnitSize('');
    setPantrySearch('');
  }

  // Lista de compras: lançamentos no formato do cupom. Cada lançamento credita na despensa as gramas compradas;
  // editar ajusta pela diferença e excluir desfaz o crédito.
  function openShopEditor(item, entry) {
    if (entry) {
      setShopEdit({ key: item.key, id: entry.id, qty: entry.qty, unit: entry.unit, price: entry.price || '', size: entry.size || '', confirmDelete: false });
      return;
    }
    const last = [...shopping.entries].reverse().find((e) => e.key === item.key);
    setShopEdit({
      key: item.key,
      id: null,
      qty: '',
      unit: last ? last.unit : item.unit,
      price: last ? last.price || '' : '',
      size: last && last.size ? last.size : item.size ? String(item.size) : '',
      confirmDelete: false,
    });
  }

  function saveShopEntry() {
    const ed = shopEdit;
    if (!ed) return;
    const item = shopItem(ed.key);
    if (!item || parseNum(ed.qty) <= 0) return;
    const old = ed.id ? shopping.entries.find((e) => e.id === ed.id) : null;
    const next = {
      id: ed.id || `e${Date.now().toString(36)}`,
      key: ed.key,
      date: old ? old.date : dateKey,
      qty: String(ed.qty).trim(),
      unit: ed.unit,
      price: String(ed.price || '').trim(),
      size: ed.unit === 'un' ? String(ed.size || '').trim() : '',
    };
    const delta = entryGrams(item, next) - (old ? entryGrams(item, old) : 0);
    const entries = old ? shopping.entries.map((e) => (e.id === old.id ? next : e)) : [...shopping.entries, next];
    const nextShopping = { ...shopping, entries };
    setShopping(nextShopping);
    saveJSON('shopping', nextShopping);
    if (delta !== 0) {
      const nextPantry = creditPantryStock(pantry, item.pantryId, delta);
      setPantry(nextPantry);
      saveJSON('pantry', nextPantry);
    }
    setShopEdit(null);
    setToast(old ? `${item.name}: lançamento atualizado` : `Compra lançada: ${item.name}, ${formatBRL(entryTotal(next))}`);
  }

  function deleteShopEntry() {
    const ed = shopEdit;
    if (!ed || !ed.id) return;
    if (!ed.confirmDelete) {
      setShopEdit({ ...ed, confirmDelete: true });
      return;
    }
    const item = shopItem(ed.key);
    const old = shopping.entries.find((e) => e.id === ed.id);
    if (!item || !old) {
      setShopEdit(null);
      return;
    }
    const nextShopping = { ...shopping, entries: shopping.entries.filter((e) => e.id !== old.id) };
    setShopping(nextShopping);
    saveJSON('shopping', nextShopping);
    const nextPantry = creditPantryStock(pantry, item.pantryId, -entryGrams(item, old));
    setPantry(nextPantry);
    saveJSON('pantry', nextPantry);
    setShopEdit(null);
    setToast(`Lançamento de ${item.name} excluído`);
  }

  function startNewFortnight() {
    if (!window.confirm('Começar uma quinzena nova? Os lançamentos saem da lista (o total fica no histórico) e a despensa continua como está.')) return;
    const spent = shopping.entries.reduce((s, e) => s + entryTotal(e), 0);
    const summary = { start: shopping.startDate, end: dateKey, spent: round2(spent), lines: shopping.entries.length };
    const next = { ...emptyShopping(dateKey), history: [summary, ...(shopping.history || [])].slice(0, 12) };
    setShopping(next);
    saveJSON('shopping', next);
    setShopEdit(null);
    setToast('Quinzena nova começada');
  }

  function openSlot(id) {
    setMealType(id);
    setSelectedFood(null);
    setSearch('');
    setTab('refeicoes');
  }

  const totalKcal = today.meals.reduce((s, m) => s + m.kcal, 0);
  const totalProt = today.meals.reduce((s, m) => s + m.prot, 0);
  const totalWaterMl = (today.waterLog || []).reduce((s, w) => s + w.ml, 0);
  const treatLoggedToday = today.meals.some((m) => m.mealType === 'ceia');
  const over = totalKcal - settings.kcalGoal;

  const latestWeightKg = useMemo(() => {
    if (!weights.length) return 80;
    const sorted = [...weights].sort((a, b) => (a.date < b.date ? -1 : 1));
    return sorted[sorted.length - 1].kg;
  }, [weights]);

  const week = getLastNDates(7).map((d) => {
    const day = logs[d] || emptyDay();
    const ex = day.exercise || {};
    return {
      date: d,
      kcal: day.meals.reduce((s, m) => s + m.kcal, 0),
      prot: day.meals.reduce((s, m) => s + m.prot, 0),
      kcalBurned: ex.done ? estimateCaloriesBurned(ex.type, ex.duration, latestWeightKg) : 0,
    };
  });
  const weekTotalKcal = week.reduce((s, d) => s + d.kcal, 0);
  const weekTotalProt = week.reduce((s, d) => s + d.prot, 0);
  const weekTotalBurned = week.reduce((s, d) => s + d.kcalBurned, 0);
  const weekGoalKcal = settings.kcalGoal * 7;
  const weekGoalProt = settings.proteinGoal * 7;
  const weekOverKcal = weekTotalKcal - weekGoalKcal;
  const weekOverProt = weekTotalProt - weekGoalProt;

  const presetKey = PRESET_MAP[mealType];
  const presets = presetKey ? DIET[presetKey] : [];

  const shopByKey = useMemo(() => {
    const m = {};
    for (const e of shopping.entries) (m[e.key] = m[e.key] || []).push(e);
    return m;
  }, [shopping.entries]);
  const shopStats = useMemo(() => {
    let spent = 0;
    let remainingEst = 0;
    let complete = 0;
    const perItem = {};
    for (const it of SHOPPING_ITEMS) {
      const es = shopByKey[it.key] || [];
      const grams = es.reduce((s, e) => s + entryGrams(it, e), 0);
      const total = round2(es.reduce((s, e) => s + entryTotal(e), 0));
      const ratio = it.planGrams > 0 ? grams / it.planGrams : 0;
      const done = ratio >= 0.98;
      if (done) complete += 1;
      remainingEst += it.estimate * Math.max(0, 1 - Math.min(ratio, 1));
      spent += total;
      perItem[it.key] = { grams, total, ratio, done, count: es.length };
    }
    return {
      spent: round2(spent),
      remainingEst: round2(remainingEst),
      complete,
      perItem,
      estTotal: round2(SHOPPING_ITEMS.reduce((s, i) => s + i.estimate, 0)),
      lines: shopping.entries.length,
    };
  }, [shopByKey, shopping.entries.length]);

  const filteredFoods = useMemo(() => {
    if (!search.trim()) return [];
    const q = search.trim().toLowerCase();
    return FOODS.filter((f) => f.name.toLowerCase().includes(q)).slice(0, 8);
  }, [search]);

  const isUnitBased = selectedFood && UNIT_CONSUMABLE_IDS.has(selectedFood.id) && foodEntryMode === 'unit';
  const effectiveGrams = isUnitBased ? (Number(unitQty) || 0) * (Number(unitWeight) || 0) : Number(amount) || 0;
  const previewKcal =
    selectedFood && effectiveGrams
      ? selectedFood.kcalFixed
        ? Math.round(selectedFood.kcalFixed * effectiveGrams)
        : Math.round((selectedFood.kcal100 / 100) * effectiveGrams)
      : 0;
  const previewProt =
    selectedFood && effectiveGrams
      ? selectedFood.protFixed
        ? Math.round(selectedFood.protFixed * effectiveGrams * 10) / 10
        : Math.round((selectedFood.prot100 / 100) * effectiveGrams * 10) / 10
      : 0;

  const filteredFreeIng = useMemo(() => {
    if (!freeIngSearch.trim()) return [];
    const q = freeIngSearch.trim().toLowerCase();
    return PANTRY_ITEMS.filter((f) => f.name.toLowerCase().includes(q)).slice(0, 8);
  }, [freeIngSearch]);
  const freeIngIsUnitBased = freeIngSelected && UNIT_CONSUMABLE_IDS.has(freeIngSelected.id) && freeIngEntryMode === 'unit';
  const freeIngEffectiveGrams = freeIngIsUnitBased ? (Number(freeIngQty) || 0) * (Number(freeIngWeight) || 0) : Number(freeIngQty) || 0;

  const filteredPantryItems = useMemo(() => {
    if (!pantrySearch.trim()) return [];
    const q = pantrySearch.trim().toLowerCase();
    return PANTRY_ITEMS.filter((f) => f.name.toLowerCase().includes(q)).slice(0, 8);
  }, [pantrySearch]);

  const emptyStockItems = useMemo(
    () => PANTRY_ITEMS.filter((p) => pantry.consumptionSeen[p.id] && (pantry.stock[p.id] ?? 0) <= 0),
    [pantry.stock, pantry.consumptionSeen]
  );
  const lowStockItems = useMemo(
    () => PANTRY_ITEMS.filter((p) => pantry.consumptionSeen[p.id] && (pantry.stock[p.id] ?? 0) > 0 && (pantry.stock[p.id] ?? 0) <= p.threshold),
    [pantry.stock, pantry.consumptionSeen]
  );

  const TAB_TITLES = { hoje: 'Hoje', refeicoes: 'Refeições', lista: 'Lista de compras', despensa: 'Despensa', progresso: 'Progresso' };
  const nowDate = new Date();
  const todayLabelRaw = `${WEEKDAYS_LONG[nowDate.getDay()]}, ${nowDate.getDate()} de ${MONTHS_LONG[nowDate.getMonth()]}`;
  const todayLabel = todayLabelRaw.charAt(0).toUpperCase() + todayLabelRaw.slice(1);
  const mealLabel = (id) => (MEAL_TYPES.find((mt) => mt.id === id) || {}).label || '';

  // Formulário de lançamento (Qtde, UN, Vl. unit, Vl. total) que abre dentro do cupom.
  function renderShopEditor(it) {
    const ed = shopEdit;
    const st = shopStats.perItem[it.key];
    const remainingGrams = Math.max(0, it.planGrams - (st ? st.grams : 0));
    let qtyHint = '';
    if (ed.unit === 'kg') qtyHint = fmtNum(remainingGrams / 1000, 3) || '1';
    else {
      const per = parseNum(ed.size) * (it.sizeGrams || 1);
      qtyHint = per > 0 ? fmtNum(Math.max(remainingGrams / per, 1), 1) : '1';
    }
    const estUnit = ed.unit === 'kg'
      ? it.estimate / (it.planGrams / 1000)
      : it.estimate / Math.max(it.planGrams / Math.max(parseNum(ed.size) * (it.sizeGrams || 1), 1), 1);
    const set = (patch) => setShopEdit({ ...ed, ...patch, confirmDelete: false });
    const fieldId = `shop-${it.key}`;
    return (
      <div key="editor" id="shop-editor" style={{ margin: '10px 0 6px', padding: 12, background: '#FBF8F1', border: `1px solid ${PALETTE.inkLine}`, borderRadius: 10, scrollMarginBottom: 96 }}>
        <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1fr) auto minmax(0,1fr)', gap: 8, alignItems: 'end' }}>

              placeholder={qtyHint}
              style={RECEIPT_INPUT}
            />
          </label>
          <div style={RECEIPT_LABEL}>
            UN
            <div role="group" aria-label="Unidade" style={{ display: 'flex', border: `1px solid ${PALETTE.inkLine}`, borderRadius: 8, overflow: 'hidden', marginTop: 4, background: '#FFFDF8' }}>
              {['kg', 'un'].map((u) => (
                <button
                  key={u}

                  aria-pressed={ed.unit === u}
                  onClick={() => set({ unit: u, size: u === 'un' && !ed.size ? (it.size ? String(it.size) : '') : ed.size })}
                  style={{ minWidth: 46, minHeight: 41, border: 'none', background: ed.unit === u ? PALETTE.ink : 'transparent', color: ed.unit === u ? PALETTE.paper : PALETTE.ink, fontFamily: FONT_RECEIPT, fontSize: 15, cursor: 'pointer' }}
                >
                  {u}
                </button>
              ))}
            </div>
          </div>
          <label htmlFor={`${fieldId}-price`} style={RECEIPT_LABEL}>
            Vl. unit
            <input
              id={`${fieldId}-price`}
              inputMode="decimal"
              autoComplete="off"
              enterKeyHint="done"
              value={ed.price}
              onChange={(e) => set({ price: e.target.value })}
              placeholder={fmtMoney(estUnit)}
              style={RECEIPT_INPUT}
            />
          </label>
        </div>
        {ed.unit === 'un' && (
          <label htmlFor={`${fieldId}-size`} style={{ ...RECEIPT_LABEL, display: 'flex', alignItems: 'center', gap: 8, marginTop: 10, fontSize: 13.5, color: PALETTE.ink }}>
            1 un tem
            <input
              id={`${fieldId}-size`}
              inputMode="decimal"
              autoComplete="off"
              value={ed.size}
              onChange={(e) => set({ size: e.target.value })}
              placeholder={it.size ? String(it.size) : '500'}
              style={{ ...RECEIPT_INPUT, width: 96, marginTop: 0 }}
            />
            {it.sizeLabel === 'ovos' ? 'ovos' : 'g'}
          </label>
        )}
        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 12, fontWeight: 600, fontSize: 15 }}>
          <span>Vl. total</span>
          <span>R$ {fmtMoney(entryTotal(ed))}</span>
        </div>
        <div style={{ display: 'flex', gap: 8, marginTop: 12, alignItems: 'center', flexWrap: 'wrap' }}>
          {ed.id && (
            <button type="button" onClick={deleteShopEntry} style={{ ...RECEIPT_BTN, borderColor: PALETTE.inkAlert, color: PALETTE.inkAlert }}>
              {ed.confirmDelete ? 'Confirmar exclusão' : 'Excluir'}
            </button>
          )}
          <span style={{ flex: 1 }} />
          <button type="button" onClick={() => setShopEdit(null)} style={RECEIPT_BTN}>
            Cancelar
          </button>
          <button
            type="button"
            onClick={saveShopEntry}
            disabled={parseNum(ed.qty) <= 0}
            style={{ ...RECEIPT_BTN, background: parseNum(ed.qty) > 0 ? PALETTE.ink : PALETTE.inkLine, borderColor: parseNum(ed.qty) > 0 ? PALETTE.ink : PALETTE.inkLine, color: PALETTE.paper, cursor: parseNum(ed.qty) > 0 ? 'pointer' : 'default' }}
          >
            {ed.id ? 'Salvar' : 'Lançar'}
          </button>
        </div>
      </div>
    );
  }

  if (loading) {
    return (
      <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: PALETTE.bg, color: PALETTE.textMuted, fontFamily: FONT_SANS, fontSize: 15 }}>
        Carregando seus dados…
      </div>
    );
  }

  return (
    <div style={{ background: PALETTE.bg, minHeight: '100vh', fontFamily: FONT_SANS, color: PALETTE.text }}>
      <div style={{ maxWidth: 440, margin: '0 auto', minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
        {/* Cabeçalho da aba */}
        <header style={{ padding: 'calc(18px + env(safe-area-inset-top, 0px)) 20px 10px', display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 12 }}>
          <div>
            {tab === 'hoje' && <div style={{ fontSize: 15, color: PALETTE.textMuted, fontWeight: 600, marginBottom: 2 }}>{todayLabel}</div>}
            <h1 style={{ ...CONDENSED, margin: 0, fontSize: 36, fontWeight: 800, letterSpacing: -0.4, lineHeight: 1.05 }}>{TAB_TITLES[tab]}</h1>
          </div>
          {tab === 'hoje' && (
            <div style={{ paddingBottom: 6 }}>
              <BrandMark />
            </div>
          )}
        </header>

        {/* Aviso rápido */}
        <div

          aria-live="polite"
          style={{ position: 'fixed', top: 'calc(12px + env(safe-area-inset-top, 0px))', left: '50%', transform: 'translateX(-50%)', width: 'max-content', maxWidth: 'calc(100% - 32px)', zIndex: 50, pointerEvents: 'none' }}
        >
          {toast && (
            <div style={{ background: PALETTE.text, color: PALETTE.bg, padding: '11px 16px', borderRadius: 14, fontSize: 15, fontWeight: 600, lineHeight: 1.35, textAlign: 'center', boxShadow: '0 1px 2px rgba(0,0,0,0.3), 0 10px 28px rgba(0,0,0,0.45)' }}>
              {toast}
            </div>
          )}
        </div>

        {/* Conteúdo */}
        <main style={{ flex: 1, padding: '6px 20px 112px' }}>
          {tab === 'hoje' && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 28 }}>
              <div style={{ display: 'flex', justifyContent: 'center', paddingTop: 4 }}>
                <PontoDial value={totalKcal} goal={settings.kcalGoal} />
              </div>

              {over > 0 && (
                <div style={cardStyle({ background: 'rgba(224,113,79,0.10)', border: `1px solid ${PALETTE.paprika}66`, marginTop: -12 })}>
                  <div style={{ fontWeight: 700, fontSize: 16, color: PALETTE.paprika, marginBottom: 4 }}>Passou {fmtInt(over)} kcal da meta de hoje</div>
                  <div style={{ fontSize: 15, color: PALETTE.text, lineHeight: 1.5 }}>

              <section aria-label="Proteína e água" style={cardStyle({ padding: 0 })}>

                <MacroRow
                  label="Água"

                >
                  <div style={{ display: 'flex', gap: 8, marginTop: 14 }}>
                    {[200, 300, 500].map((ml) => (
                      <button

                  </div>
                  {waterExpanded && (

                          style={{ minHeight: 44, padding: '0 16px', borderRadius: 12, border: 'none', background: !customWaterMl || Number(customWaterMl) <= 0 ? PALETTE.track : PALETTE.teal, color: PALETTE.bg, fontWeight: 700, fontSize: 15, cursor: 'pointer' }}
                        >

                              <span>{fmtInt(w.ml)} ml</span>

                <div style={{ display: 'flex', gap: 6, marginBottom: 14 }}>
                  {getLastNDates(7).map((d) => {
                    const done = !!(logs[d] || {}).exercise?.done;
                    const isToday = d === dateKey;
                    const isSelected = historyDate === d;
                    const dt = new Date(d + 'T00:00:00');
                    return (
                      <button
                        key={d}
                        type="button"
                        onClick={() => setHistoryDate(isSelected ? null : d)}
                        aria-pressed={isSelected}
                        aria-label={`${WEEKDAYS_LONG[dt.getDay()]}, ${dt.getDate()}${isToday ? ', hoje' : ''}${done ? ', treinou' : ''}`}
                        style={{

                        <span style={{ ...CONDENSED, fontSize: 19, fontWeight: 800, color: done ? PALETTE.bg : PALETTE.text }}>{dt.getDate()}</span>

                                      {fmtNum(parseNum(e.qty), 3)} {e.unit}
                                      {e.unit === 'un' && parseNum(e.size) > 0 ? ` (${fmtInt(parseNum(e.size))} ${it.sizeLabel === 'ovos' ? 'ovos' : 'g'})` : ''} x{' '}
                                      {parseNum(e.price) > 0 ? fmtMoney(parseNum(e.price)) : 'sem preço'}
                                      {e.note && <span style={{ display: 'block', color: PALETTE.inkAlert, fontSize: 12 }}>{e.note}</span>}
                                    </span>
                                    <span style={{ flexShrink: 0 }}>{fmtMoney(entryTotal(e))}</span>
                                  </button>
                                )
                              )}
                              {addingHere && renderShopEditor(it)}
                            </div>
                          );
                        })}
                      </section>
                    );
                  })}
                  {shopFilter === 'falta' && shopStats.complete === SHOPPING_ITEMS.length && (
                    <p style={{ textAlign: 'center', margin: '18px 0 6px' }}>Tudo comprado nesta quinzena.</p>
                  )}

                  <ReceiptRule />
                  <ReceiptLine left="SUBTOTAL R$" right={fmtMoney(shopStats.spent)} strong />
                  <ReceiptLine left="Lançamentos" right={shopStats.lines} />
                  <ReceiptLine left="Itens completos" right={`${shopStats.complete}/${SHOPPING_ITEMS.length}`} />
                  <ReceiptLine left="Falta comprar (estim.)" right={fmtMoney(shopStats.remainingEst)} />
                  <ReceiptLine left="Estimado do plano" right={fmtMoney(shopStats.estTotal)} muted />
                  <ReceiptRule double />
                  <p style={{ textAlign: 'center', color: PALETTE.inkMuted, fontSize: 12.5, margin: 0, lineHeight: 1.5 }}>
                    Toque num lançamento pra corrigir.
                    <br />
                    Cada compra lançada entra na despensa.
                  </p>
                </div>
              </div>

              {(shopping.history || []).length > 0 && (
                <section aria-labelledby="h-quinzenas">
                  <SectionHeader title={<span id="h-quinzenas">Quinzenas anteriores</span>} />
                  <div style={cardStyle({ padding: '0 16px' })}>
                    {shopping.history.map((h, i) => (
                      <div key={`${h.start}-${i}`} style={{ display: 'flex', justifyContent: 'space-between', gap: 12, padding: '14px 0', borderTop: i ? `1px solid ${PALETTE.border}` : 'none', fontSize: 15 }}>
                        <span style={{ color: PALETTE.textMuted }}>
                          {fmtDayMonth(h.start)} a {fmtDayMonth(h.end)}
                        </span>
                        <span style={{ fontWeight: 700 }}>{formatBRL(h.spent)}</span>
                      </div>
                    ))}
                  </div>
                </section>
              )}

              <GhostButton onClick={startNewFortnight}>Começar quinzena nova</GhostButton>
            </div>
          )}

          {tab === 'progresso' && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
              <div style={cardStyle()}>
                <div style={{ ...SECTION_TITLE, marginBottom: 12 }}>Resumo da semana</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                  <div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 4 }}>
                      <span style={{ fontSize: 14, color: PALETTE.textMuted }}>Calorias</span>
                      <span style={{ fontFamily: FONT_NUM, fontSize: 15 }}>
                        {fmtInt(weekTotalKcal)} de {fmtInt(weekGoalKcal)} kcal
                      </span>
                    </div>
                    <div style={{ fontSize: 14, color: weekOverKcal > 0 ? PALETTE.paprika : PALETTE.sage }}>
                      {weekOverKcal > 0 ? `${fmtInt(weekOverKcal)} kcal acima da meta da semana` : `${fmtInt(-weekOverKcal)} kcal abaixo da meta da semana`}
                    </div>
                  </div>
                  <div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 4 }}>
                      <span style={{ fontSize: 14, color: PALETTE.textMuted }}>Proteína</span>
                      <span style={{ fontFamily: FONT_NUM, fontSize: 15 }}>
                        {fmtInt(weekTotalProt)} de {fmtInt(weekGoalProt)} g
                      </span>
                    </div>
                    <div style={{ fontSize: 14, color: weekOverProt >= 0 ? PALETTE.sage : PALETTE.paprika }}>
                      {weekOverProt >= 0 ? `${fmtInt(weekOverProt)} g acima da meta da semana` : `${fmtInt(-weekOverProt)} g abaixo da meta da semana`}
                    </div>
                  </div>
                  {weekTotalBurned > 0 && (
                    <div style={{ paddingTop: 8, borderTop: `1px solid ${PALETTE.border}` }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                        <span style={{ fontSize: 14, color: PALETTE.textMuted }}>Estimativa gasta em treino</span>
                        <span style={{ fontFamily: FONT_NUM, fontSize: 15, color: PALETTE.honey }}>cerca de {fmtInt(weekTotalBurned)} kcal</span>
                      </div>
                    </div>
                  )}
                </div>
              </div>

              <div style={cardStyle()}>
                <div style={{ ...SECTION_TITLE, marginBottom: 10 }}>Calorias dos últimos 7 dias</div>
                <WeekBars data={week} goal={settings.kcalGoal} />
              </div>

              <div style={cardStyle()}>
                <div style={{ ...SECTION_TITLE, marginBottom: 10 }}>Peso</div>
                <WeightChart weights={weights} />
                <div style={{ display: 'flex', gap: 8, marginTop: 14 }}>
                  <input
                    type="text"
                    autoComplete="off"
                    placeholder="peso de hoje (kg)" aria-label="Peso de hoje em kg" inputMode="decimal"
                    value={weightInput}
                    onChange={(e) => setWeightInput(e.target.value)}
                    style={{ flex: 1, background: PALETTE.surfaceAlt, border: `1px solid ${PALETTE.border}`, borderRadius: 10, color: PALETTE.text, padding: '9px 10px', fontSize: 16 }}
                  />
                  <button onClick={saveWeight} style={{ padding: '9px 16px', borderRadius: 10, border: 'none', background: PALETTE.honey, color: '#1B1815', fontWeight: 800, fontSize: 15, cursor: 'pointer' }}>
                    Salvar
                  </button>
                </div>
              </div>

              <div style={cardStyle()}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
                  <div style={{ ...SECTION_TITLE }}>Metas diárias</div>
                  {!settingsForm && (
                    <button
                      onClick={() => setSettingsForm({ kcalGoal: settings.kcalGoal, proteinGoal: settings.proteinGoal, waterGoalMl: settings.waterGoalMl })}
                      style={{ background: 'none', border: 'none', color: PALETTE.honey, fontSize: 15, fontWeight: 700, cursor: 'pointer', minHeight: 44, padding: '0 4px' }}
                    >
                      Editar
                    </button>
                  )}
                </div>
                {!settingsForm ? (
                  <div style={{ fontSize: 15, lineHeight: 1.8, color: PALETTE.textMuted }}>
                    <div>Calorias: <strong style={{ color: PALETTE.text }}>{fmtInt(settings.kcalGoal)} kcal</strong></div>
                    <div>Proteína: <strong style={{ color: PALETTE.text }}>{fmtInt(settings.proteinGoal)} g</strong></div>
                    <div>Água: <strong style={{ color: PALETTE.text }}>{fmtNum(settings.waterGoalMl / 1000, 1)} L</strong></div>
                  </div>
                ) : (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                    <label style={{ fontSize: 14, color: PALETTE.textMuted }}>
                      Calorias (kcal)
                      <input
                        type="number"
                        value={settingsForm.kcalGoal}
                        onChange={(e) => setSettingsForm({ ...settingsForm, kcalGoal: e.target.value })}
                        style={{ width: '100%', marginTop: 4, background: PALETTE.surfaceAlt, border: `1px solid ${PALETTE.border}`, borderRadius: 10, color: PALETTE.text, padding: '8px 10px', fontSize: 16 }}
                      />
                    </label>
                    <label style={{ fontSize: 14, color: PALETTE.textMuted }}>
                      Proteína (g)
                      <input
                        type="number"
                        value={settingsForm.proteinGoal}
                        onChange={(e) => setSettingsForm({ ...settingsForm, proteinGoal: e.target.value })}
                        style={{ width: '100%', marginTop: 4, background: PALETTE.surfaceAlt, border: `1px solid ${PALETTE.border}`, borderRadius: 10, color: PALETTE.text, padding: '8px 10px', fontSize: 16 }}
                      />
                    </label>
                    <label style={{ fontSize: 14, color: PALETTE.textMuted }}>
                      Água (ml)
                      <input
                        type="number"
                        value={settingsForm.waterGoalMl}
                        onChange={(e) => setSettingsForm({ ...settingsForm, waterGoalMl: e.target.value })}
                        style={{ width: '100%', marginTop: 4, background: PALETTE.surfaceAlt, border: `1px solid ${PALETTE.border}`, borderRadius: 10, color: PALETTE.text, padding: '8px 10px', fontSize: 16 }}
                      />
                    </label>
                    <div style={{ display: 'flex', gap: 8, marginTop: 4 }}>
                      <button onClick={() => setSettingsForm(null)} style={{ flex: 1, padding: '9px 0', borderRadius: 10, border: `1px solid ${PALETTE.border}`, background: 'transparent', color: PALETTE.textMuted, fontSize: 15, cursor: 'pointer' }}>
                        Cancelar
                      </button>
                      <button onClick={saveSettingsForm} style={{ flex: 1, padding: '9px 0', borderRadius: 10, border: 'none', background: PALETTE.honey, color: '#1B1815', fontWeight: 800, fontSize: 15, cursor: 'pointer' }}>
                        Salvar
                      </button>
                    </div>
                  </div>
                )}
              </div>

              <button
                onClick={resetAllData}
                style={{
                  background: 'none',
                  border: `1px solid ${PALETTE.border}`,
                  borderRadius: 14,
                  color: PALETTE.textMuted,
                  fontSize: 14.5,
                  padding: '10px 14px',
                  cursor: 'pointer',
                  textAlign: 'center',
                }}
              >
                Zerar todos os dados e recomeçar
              </button>
            </div>
          )}
        </main>

        {/* Navegação */}
        <nav
          aria-label="Seções do app"
          style={{
            position: 'sticky',
            bottom: 0,
            zIndex: 20,
            background: 'rgba(27,24,21,0.97)',
            borderTop: `1px solid ${PALETTE.border}`,
            display: 'flex',
            padding: '4px 6px calc(6px + env(safe-area-inset-bottom, 0px))',
          }}
        >
          {[
            { id: 'hoje', label: 'Hoje', Icon: Home },
            { id: 'refeicoes', label: 'Refeições', Icon: UtensilsCrossed },
            { id: 'lista', label: 'Lista', Icon: ListChecks },
            { id: 'despensa', label: 'Despensa', Icon: Package },
            { id: 'progresso', label: 'Progresso', Icon: TrendingUp },
          ].map(({ id, label, Icon }) => {
            const active = tab === id;
            const alert = id === 'despensa' && (emptyStockItems.length > 0 || lowStockItems.length > 0);
            return (
              <button
                key={id}
                type="button"
                onClick={() => setTab(id)}
                aria-current={active ? 'page' : undefined}
                aria-label={alert ? `${label}, tem item acabando` : label}
                style={{
                  flex: 1,
                  minWidth: 0,
                  minHeight: 58,
                  display: 'flex',
                  flexDirection: 'column',
                  alignItems: 'center',
                  justifyContent: 'center',
                  gap: 4,
                  border: 'none',
                  background: 'transparent',
                  color: active ? PALETTE.honey : PALETTE.textMuted,
                  cursor: 'pointer',
                  position: 'relative',
                  padding: '8px 0 4px',
                }}
              >
                <span aria-hidden="true" style={{ position: 'absolute', top: 0, left: '50%', width: 28, height: 3, marginLeft: -14, borderRadius: 2, background: active ? PALETTE.honey : 'transparent' }} />
                <Icon size={22} />
                <span style={{ fontSize: 12.5, fontWeight: active ? 700 : 600, whiteSpace: 'nowrap' }}>{label}</span>
                {alert && <span aria-hidden="true" style={{ position: 'absolute', top: 8, left: '50%', marginLeft: 8, width: 8, height: 8, borderRadius: '50%', background: PALETTE.paprika, boxShadow: `0 0 0 2px ${PALETTE.bg}` }} />}
              </button>
            );
          })}
        </nav>
      </div>
    </div>
  );
}

const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(<App />);
</script>

<script>
  var src = document.getElementById('app-source').textContent;
  var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
  (0, eval)(out);
</script>
</body>
</html>
